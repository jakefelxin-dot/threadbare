<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fieldstone — Shop Independent Makers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F6F7F9;
    --surface:#FFFFFF;
    --ink:#12131A;
    --muted:#6B6F7B;
    --faint:#9599A3;
    --line:#E7E9ED;
    --accent:#2E4CFF;
    --accent-ink:#1A2FCC;
    --accent-soft:#EDF0FF;
    --coral:#FF5A3C;
    --green:#1B8A5A;
    --green-soft:#E8F5EE;
    --gold:#F5A623;
    --radius-lg:16px;
    --radius-md:12px;
    --radius-sm:8px;
    --shadow:0 1px 2px rgba(18,19,26,0.04), 0 8px 24px -12px rgba(18,19,26,0.10);
    --shadow-hover:0 4px 10px rgba(18,19,26,0.06), 0 16px 32px -12px rgba(18,19,26,0.16);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter', sans-serif;
    -webkit-font-smoothing:antialiased;
    font-size:15px;
  }
  button, input, select, textarea{font-family:inherit;}
  button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, a:focus-visible{
    outline:2px solid var(--accent); outline-offset:2px;
  }
  ::-webkit-scrollbar{width:10px; height:10px;}
  ::-webkit-scrollbar-thumb{background:#D6D9DF; border-radius:10px;}

  @keyframes fadeInUp{ from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);} }
  @keyframes fadeIn{ from{opacity:0;} to{opacity:1;} }
  @keyframes mascotFloat{ 0%,100%{transform:translateY(0);} 50%{transform:translateY(-9px);} }

  /* ===== Top bar ===== */
  .topbar{
    position:sticky; top:0; z-index:50;
    background:var(--surface);
    border-bottom:1px solid var(--line);
  }
  .topbar-inner{
    max-width:1440px; margin:0 auto;
    display:flex; align-items:center; gap:20px;
    padding:14px 28px;
  }
  .logo{
    display:flex; align-items:center; gap:9px;
    font-weight:800; font-size:18px; letter-spacing:-0.02em;
    flex-shrink:0; cursor:pointer; border:none; background:none; color:var(--ink);
  }
  .logo .mark{
    width:26px; height:26px; border-radius:8px;
    background:linear-gradient(135deg, var(--accent), #7C5CFF);
    display:flex; align-items:center; justify-content:center;
    color:#fff; font-size:14px; font-weight:800;
  }
  .search-wrap{
    flex:1; max-width:640px;
    position:relative;
  }
  .search-wrap svg{
    position:absolute; left:15px; top:50%; transform:translateY(-50%);
    color:var(--faint); pointer-events:none;
  }
  .search-wrap input{
    width:100%;
    border:1.5px solid var(--line);
    background:var(--bg);
    border-radius:999px;
    padding:11px 40px 11px 42px;
    font-size:14px;
    color:var(--ink);
    transition:border-color .15s ease, background .15s ease;
  }
  .search-wrap input:focus{border-color:var(--accent); background:var(--surface); outline:none;}
  .search-wrap input::placeholder{color:var(--faint);}
  .search-clear{
    position:absolute; right:8px; top:50%; transform:translateY(-50%);
    width:26px; height:26px; border-radius:999px; border:none;
    background:var(--line); color:var(--muted); cursor:pointer;
    display:none; align-items:center; justify-content:center; font-size:14px; line-height:1;
  }
  .search-clear.show{display:flex;}
  .search-clear:hover{background:#D6D9DF; color:var(--ink);}

  .topbar-actions{display:flex; align-items:center; gap:10px; flex-shrink:0;}
  .icon-btn{
    width:40px; height:40px;
    border-radius:999px;
    border:1.5px solid var(--line);
    background:var(--surface);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; color:var(--ink);
    position:relative;
    transition:border-color .15s ease, transform .15s ease;
  }
  .icon-btn:hover{border-color:var(--ink); transform:translateY(-1px);}
  .icon-btn.fav-active{color:var(--coral); border-color:var(--coral);}
  .cart-badge{
    position:absolute; top:-5px; right:-5px;
    background:var(--coral); color:#fff;
    font-size:10px; font-weight:700;
    min-width:18px; height:18px; border-radius:999px;
    display:flex; align-items:center; justify-content:center;
    padding:0 4px;
  }
  .sell-btn{
    background:var(--ink); color:#fff;
    border:none; padding:10px 18px;
    border-radius:999px; font-weight:600; font-size:13.5px;
    cursor:pointer; white-space:nowrap; transition:background .15s ease;
  }
  .sell-btn:hover{background:#2b2d38;}

  /* ===== Layout ===== */
  .layout{
    max-width:1440px; margin:0 auto;
    display:flex; align-items:flex-start;
    gap:32px;
    padding:28px;
  }

  /* ===== Sidebar ===== */
  .sidebar{
    width:264px; flex-shrink:0;
    position:sticky; top:82px;
    display:flex; flex-direction:column; gap:26px;
  }
  .sidebar-mobile-head{display:none;}

  .sb-section-title{
    font-size:11.5px; font-weight:700; text-transform:uppercase;
    letter-spacing:0.07em; color:var(--faint);
    margin-bottom:12px;
  }
  .cat-list{list-style:none; display:flex; flex-direction:column; gap:3px;}
  .cat-item{
    display:flex; align-items:center; justify-content:space-between;
    padding:8px 10px 8px 8px;
    border-radius:var(--radius-md);
    font-size:14px; font-weight:500;
    cursor:pointer; color:var(--ink);
    border:none; background:none; width:100%; text-align:left;
    transition:background .18s ease, color .18s ease, transform .12s ease;
  }
  .cat-item:hover{background:var(--bg);}
  .cat-item:active{transform:scale(0.98);}
  .cat-item.active{background:var(--accent-soft); color:var(--accent-ink); font-weight:700;}
  .cat-left{display:flex; align-items:center; gap:11px;}
  .cat-icon{
    width:30px; height:30px; border-radius:9px;
    background:var(--bg);
    display:flex; align-items:center; justify-content:center;
    font-size:14.5px; flex-shrink:0;
    transition:background .18s ease, transform .18s ease;
  }
  .cat-item.active .cat-icon{background:var(--surface); box-shadow:0 1px 3px rgba(18,19,26,0.08); transform:scale(1.06);}
  .cat-item .count{font-size:12px; color:var(--faint); font-weight:600; transition:color .18s ease;}
  .cat-item.active .count{color:var(--accent);}

  .price-slider{padding:2px 2px 0;}
  .price-slider input[type=range]{
    width:100%; accent-color:var(--accent); cursor:pointer;
  }
  .price-labels{
    display:flex; justify-content:space-between;
    font-size:12.5px; color:var(--muted); margin-top:6px; font-weight:500;
  }

  .check-row{
    display:flex; align-items:center; gap:9px;
    font-size:14px; color:var(--muted); font-weight:500;
    padding:6px 2px; cursor:pointer;
  }
  .check-row input{width:16px; height:16px; accent-color:var(--accent); cursor:pointer;}

  /* ===== Rating filter ===== */
  .rating-stars{display:flex; gap:5px; margin-bottom:7px;}
  .star-btn{
    background:none; border:none; font-size:23px; line-height:1;
    color:var(--line); cursor:pointer; padding:0;
    transition:color .15s ease, transform .15s ease;
  }
  .star-btn:hover{transform:scale(1.18);}
  .star-btn.active{color:var(--gold);}
  .rating-label{font-size:12px; color:var(--muted); font-weight:600;}

  .clear-filters{
    font-size:13px; font-weight:600; color:var(--accent);
    background:none; border:none; cursor:pointer; padding:0;
    text-align:left;
  }
  .clear-filters:hover{text-decoration:underline;}

  /* mobile filter toggle */
  .filter-toggle{display:none;}

  /* ===== Preference / membership cards ===== */
  .pref-card{background:var(--accent-soft); border-radius:var(--radius-md); padding:15px;}
  .pref-card h4{font-size:13.5px; font-weight:700; color:var(--accent-ink); margin-bottom:5px;}
  .pref-card p{font-size:12px; color:var(--muted); margin-bottom:12px; line-height:1.45;}
  .pref-card.member{background:var(--green-soft);}
  .pref-card.member h4{color:var(--green);}
  .take-quiz-btn{
    background:var(--accent); color:#fff; border:none; padding:9px 15px;
    border-radius:999px; font-weight:700; font-size:12.5px; cursor:pointer; width:100%;
    transition:background .15s ease;
  }
  .take-quiz-btn:hover{background:var(--accent-ink);}
  .pref-chips{display:flex; flex-wrap:wrap; gap:5px; margin-bottom:12px;}
  .pref-chip-mini{
    font-size:11px; font-weight:600; background:var(--surface); color:var(--accent-ink);
    padding:4px 10px; border-radius:999px;
  }
  .pref-edit-row{display:flex; gap:14px;}
  .pref-edit-row button{
    font-size:12px; font-weight:700; background:none; border:none;
    color:var(--accent-ink); cursor:pointer; padding:0;
  }
  .pref-edit-row button:last-child{color:var(--muted);}
  .pref-edit-row button:hover{text-decoration:underline;}

  /* ===== Main content ===== */
  .content{flex:1; min-width:0;}

  .breadcrumb{
    display:flex; align-items:center; gap:6px;
    font-size:12.5px; color:var(--faint); font-weight:600; margin-bottom:14px;
  }
  .breadcrumb button{background:none; border:none; color:var(--accent); cursor:pointer; font-weight:600; font-size:12.5px; padding:0;}
  .breadcrumb button:hover{text-decoration:underline;}

  /* ===== Shop panel (turns into a "shelf box" when a category is active) ===== */
  .shop-panel{
    border:1px solid transparent;
    border-radius:var(--radius-lg);
    transition:background .22s ease, border-color .22s ease, box-shadow .22s ease, padding .22s ease;
  }
  .shop-panel.boxed{
    background:var(--surface);
    border-color:var(--line);
    padding:22px 22px 26px;
    box-shadow:var(--shadow);
  }
  .shelf-ribbon{
    align-items:center; gap:14px;
    padding-bottom:18px; margin-bottom:18px; border-bottom:1px solid var(--line);
    animation:fadeInUp .3s ease both;
  }
  .shelf-ribbon .icon{
    width:48px; height:48px; border-radius:14px; background:var(--accent-soft);
    display:flex; align-items:center; justify-content:center; font-size:22px; flex-shrink:0;
  }
  .shelf-ribbon h2{font-size:19px; font-weight:800; letter-spacing:-0.01em;}
  .shelf-ribbon p{font-size:12.5px; color:var(--muted); margin-top:2px;}

  .content-head{
    display:flex; align-items:center; justify-content:space-between;
    flex-wrap:wrap; gap:12px;
    margin-bottom:20px;
  }
  .content-head h1{
    font-size:22px; font-weight:800; letter-spacing:-0.02em;
  }
  .content-head .sub{font-size:13.5px; color:var(--muted); font-weight:500; margin-top:2px;}

  .sort-wrap{position:relative;}
  .sort-wrap select{
    appearance:none;
    border:1.5px solid var(--line);
    background:var(--surface);
    border-radius:var(--radius-sm);
    padding:9px 34px 9px 14px;
    font-size:13.5px; font-weight:600; color:var(--ink);
    cursor:pointer;
  }
  .sort-wrap::after{
    content:"";
    position:absolute; right:13px; top:50%;
    width:7px; height:7px;
    border-right:1.6px solid var(--muted); border-bottom:1.6px solid var(--muted);
    transform:translateY(-65%) rotate(45deg);
    pointer-events:none;
  }

  .grid{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:18px;
  }
  @media (max-width:1180px){ .grid{grid-template-columns:repeat(2,1fr);} }
  @media (max-width:620px){ .grid{grid-template-columns:1fr;} }

  .card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius-lg);
    overflow:hidden;
    display:flex; flex-direction:column;
    box-shadow:var(--shadow);
    transition:transform .15s ease, box-shadow .15s ease;
    cursor:pointer;
    animation:fadeInUp .35s ease both;
  }
  .card:hover{transform:translateY(-3px); box-shadow:var(--shadow-hover);}

  .card-media{
    height:180px; position:relative;
  }
  .card-media .swatch{width:100%; height:100%; background-size:cover; background-position:center;}
  .badge-stack{
    position:absolute; top:10px; left:10px;
    display:flex; flex-direction:column; gap:6px; align-items:flex-start;
  }
  .badge{
    font-size:10.5px; font-weight:700; padding:4px 9px; border-radius:999px;
    text-transform:uppercase; letter-spacing:0.03em;
  }
  .badge.low{background:#FFF1E8; color:#B45309;}
  .badge.out{background:#F1F2F4; color:var(--muted);}
  .badge.mine{background:var(--ink); color:#fff;}
  .badge.locked{background:var(--accent-ink); color:#fff;}
  .fav-btn{
    position:absolute; top:10px; right:10px;
    width:32px; height:32px; border-radius:999px;
    background:rgba(255,255,255,0.92); border:none;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; color:var(--ink); backdrop-filter:blur(4px);
    transition:transform .15s ease;
  }
  .fav-btn:hover{transform:scale(1.1);}
  .fav-btn.active{color:var(--coral);}
  .quick-add{
    position:absolute; bottom:10px; left:10px; right:10px;
    background:var(--ink); color:#fff;
    border:none; padding:10px; border-radius:var(--radius-sm);
    font-weight:600; font-size:13px; cursor:pointer;
    opacity:0; transform:translateY(6px);
    transition:all .15s ease;
  }
  .card:hover .quick-add{opacity:1; transform:translateY(0);}
  .quick-add.added{background:var(--green);}

  .card-body{padding:14px 15px 16px; display:flex; flex-direction:column; gap:4px;}
  .maker{font-size:11.5px; font-weight:600; color:var(--accent); text-transform:uppercase; letter-spacing:0.04em;}
  .card-body h3{font-size:15px; font-weight:700; letter-spacing:-0.01em; line-height:1.3;}
  .card-body .desc{font-size:12.5px; color:var(--muted); line-height:1.4; min-height:32px;}
  .card-foot{display:flex; align-items:center; justify-content:space-between; margin-top:6px;}
  .price{font-size:16px; font-weight:800;}
  .rating{display:flex; align-items:center; gap:4px; font-size:12px; color:var(--muted); font-weight:600;}

  .empty-state{
    padding:80px 20px; text-align:center;
    color:var(--muted); font-size:14px;
    background:var(--surface); border:1px dashed var(--line); border-radius:var(--radius-lg);
    animation:fadeIn .25s ease;
  }
  .shop-panel.boxed .empty-state{border:1px dashed var(--line); background:var(--bg);}
  .empty-state strong{display:block; font-size:16px; color:var(--ink); margin-bottom:6px;}
  .empty-cta{
    display:none; margin:16px auto 0; background:var(--ink); color:#fff; border:none;
    padding:10px 20px; border-radius:999px; font-weight:700; font-size:13px; cursor:pointer;
  }
  .empty-cta:hover{background:#2b2d38;}

  /* ===== Horizontal strips (recently viewed / picked for you) ===== */
  .strip-section{margin-top:36px;}
  .foryou-section{margin-bottom:28px;}
  .strip-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
  .strip-head .sb-section-title{margin-bottom:0;}
  .strip-head button{
    font-size:12px; font-weight:700; color:var(--accent); background:none; border:none; cursor:pointer;
  }
  .strip-head button:hover{text-decoration:underline;}
  .h-strip{display:flex; gap:14px; overflow-x:auto; padding-bottom:6px;}
  .strip-card{
    flex-shrink:0; width:150px; cursor:pointer;
    border:1px solid var(--line); border-radius:var(--radius-md); overflow:hidden;
    background:var(--surface); transition:box-shadow .15s ease, transform .15s ease;
  }
  .strip-card:hover{box-shadow:var(--shadow-hover); transform:translateY(-2px);}
  .strip-card .swatch{height:90px; background-size:cover; background-position:center;}
  .strip-card .sc-body{padding:9px 10px;}
  .strip-card h4{font-size:12.5px; font-weight:700; line-height:1.3;}
  .strip-card .price{font-size:12.5px; font-weight:800; margin-top:3px; display:block;}

  /* ===== Overlay (shared) ===== */
  .overlay{
    position:fixed; inset:0; background:rgba(18,19,26,0.45);
    opacity:0; pointer-events:none; transition:opacity .2s ease; z-index:80;
  }
  .overlay.open{opacity:1; pointer-events:auto;}

  /* ===== Cart drawer ===== */
  .drawer{
    position:fixed; top:0; right:0; bottom:0; width:min(420px, 94vw);
    background:var(--surface); z-index:90;
    transform:translateX(100%); transition:transform .25s cubic-bezier(.4,0,.2,1);
    display:flex; flex-direction:column;
    box-shadow:-16px 0 40px rgba(0,0,0,0.12);
  }
  .drawer.open{transform:translateX(0);}
  .drawer-head{
    display:flex; align-items:center; justify-content:space-between;
    padding:20px 22px; border-bottom:1px solid var(--line);
  }
  .drawer-head h2{font-size:18px; font-weight:800; letter-spacing:-0.01em;}
  .close-btn{
    width:34px; height:34px; border-radius:999px; border:none; background:var(--bg);
    font-size:18px; cursor:pointer; color:var(--ink); transition:background .15s ease, transform .15s ease;
    flex-shrink:0;
  }
  .close-btn:hover{background:var(--line); transform:rotate(90deg);}

  .ship-progress{padding:14px 22px 0;}
  .ship-progress .msg{font-size:12.5px; font-weight:600; color:var(--ink); margin-bottom:8px;}
  .ship-progress .msg strong{color:var(--green);}
  .ship-bar{height:6px; border-radius:999px; background:var(--line); overflow:hidden;}
  .ship-bar-fill{height:100%; background:var(--green); border-radius:999px; transition:width .3s ease;}

  .drawer-items{flex:1; overflow-y:auto; padding:6px 22px;}
  .drawer-item{
    display:flex; gap:12px; align-items:flex-start;
    padding:16px 0; border-bottom:1px solid var(--line);
  }
  .drawer-item .swatch{width:58px; height:58px; border-radius:var(--radius-sm); flex-shrink:0; background-size:cover; background-position:center;}
  .di-info{flex:1;}
  .di-info h4{font-size:14px; font-weight:700; cursor:pointer;}
  .di-info h4:hover{color:var(--accent);}
  .di-info .maker{font-size:10.5px;}
  .qty-row{display:flex; align-items:center; gap:10px; margin-top:8px;}
  .qty-row button{
    width:24px; height:24px; border:1px solid var(--line); background:var(--bg);
    border-radius:999px; cursor:pointer; font-size:14px; font-weight:600;
    display:flex; align-items:center; justify-content:center; color:var(--ink);
  }
  .qty-row span{font-size:13px; font-weight:700; min-width:14px; text-align:center;}
  .di-price{font-size:14px; font-weight:800; white-space:nowrap;}
  .remove-link{
    font-size:11.5px; color:var(--coral); background:none; border:none;
    cursor:pointer; padding:0; margin-top:8px; font-weight:600;
  }
  .drawer-empty{padding:60px 0; text-align:center; color:var(--muted); font-size:14px;}
  .drawer-foot{border-top:1px solid var(--line); padding:18px 22px 22px;}

  .discount-row{display:flex; gap:8px; margin-bottom:10px;}
  .discount-row input{
    flex:1; border:1.5px solid var(--line); border-radius:var(--radius-sm);
    padding:9px 12px; font-size:13px; text-transform:uppercase;
  }
  .discount-row input::placeholder{text-transform:none;}
  .discount-row button{
    background:var(--ink); color:#fff; border:none; padding:9px 16px;
    border-radius:var(--radius-sm); font-weight:600; font-size:12.5px; cursor:pointer; white-space:nowrap;
  }
  .discount-row button:hover{background:#2b2d38;}
  .discount-error{font-size:11.5px; color:var(--coral); font-weight:600; margin:-2px 0 10px;}
  .discount-applied{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    background:var(--green-soft); color:var(--green); font-size:12.5px; font-weight:700;
    padding:10px 12px; border-radius:var(--radius-sm); margin-bottom:12px;
  }
  .discount-applied button{background:none; border:none; color:var(--green); font-weight:700; cursor:pointer; font-size:11.5px; text-decoration:underline; flex-shrink:0;}
  .member-note{font-size:11.5px; color:var(--green); font-weight:600; margin-bottom:10px;}

  .total-row{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:4px;}
  .total-row span:first-child{font-size:13px; color:var(--muted); font-weight:600;}
  .total-row span:last-child{font-size:14px; font-weight:700;}
  .total-row.grand span:first-child{font-size:13px; color:var(--ink);}
  .total-row.grand span:last-child{font-size:21px; font-weight:800;}
  .total-row.discount span{color:var(--green) !important;}
  .total-sub{font-size:11.5px; color:var(--faint); margin:6px 0 14px;}
  .checkout-btn{
    width:100%; background:var(--accent); color:#fff; border:none;
    padding:14px; border-radius:999px; font-weight:700; font-size:14px; cursor:pointer;
    transition:background .15s ease, transform .1s ease;
  }
  .checkout-btn:hover{background:var(--accent-ink);}
  .checkout-btn:active{transform:scale(0.98);}
  .checkout-btn:disabled{background:var(--line); color:var(--faint); cursor:not-allowed;}

  /* ===== Modals (product quick view, success, quiz, seller, subscribe) ===== */
  .modal{
    position:fixed; top:50%; left:50%; z-index:95;
    width:min(760px, 92vw); max-height:88vh; overflow-y:auto;
    background:var(--surface); border-radius:var(--radius-lg);
    transform:translate(-50%,-42%) scale(0.96); opacity:0; pointer-events:none;
    transition:opacity .25s cubic-bezier(.16,1,.3,1), transform .32s cubic-bezier(.16,1,.3,1);
    box-shadow:0 24px 64px rgba(0,0,0,0.24);
  }
  .modal.open{transform:translate(-50%,-50%) scale(1); opacity:1; pointer-events:auto;}
  .modal.form-modal{width:min(560px, 92vw);}
  .modal-close{
    position:absolute; top:16px; right:16px; z-index:2;
    width:34px; height:34px; border-radius:999px; border:none; background:var(--surface);
    box-shadow:var(--shadow); font-size:18px; cursor:pointer; color:var(--ink);
    transition:transform .15s ease;
  }
  .modal-close:hover{transform:rotate(90deg);}
  .modal-grid{display:grid; grid-template-columns:1fr 1fr;}
  @media (max-width:640px){ .modal-grid{grid-template-columns:1fr;} }

  .modal-media-wrap{
    position:relative; overflow:hidden; min-height:320px;
    border-radius:var(--radius-lg) 0 0 var(--radius-lg);
  }
  @media (max-width:640px){ .modal-media-wrap{border-radius:var(--radius-lg) var(--radius-lg) 0 0; min-height:240px;} }
  .modal-media{
    width:100%; height:100%; position:absolute; inset:0;
    background-size:cover; background-position:center;
    transition:transform .5s ease, opacity .2s ease;
  }
  .modal-media-wrap:hover .modal-media{transform:scale(1.07);}
  .gallery-thumbs{
    position:absolute; bottom:14px; left:50%; transform:translateX(-50%);
    display:flex; gap:8px; z-index:2;
  }
  .thumb{
    width:34px; height:34px; border-radius:8px; border:2px solid rgba(255,255,255,0.85);
    cursor:pointer; box-shadow:0 2px 6px rgba(0,0,0,0.18);
    transition:transform .15s ease, border-color .15s ease;
  }
  .thumb:hover{transform:scale(1.1);}
  .thumb.active{border-color:#fff; box-shadow:0 0 0 2px var(--accent), 0 2px 6px rgba(0,0,0,.2);}

  .modal-body{padding:28px 28px 26px; display:flex; flex-direction:column; gap:12px;}
  .modal-body > *{animation:fadeInUp .4s cubic-bezier(.16,1,.3,1) both;}
  .modal-body > *:nth-child(1){animation-delay:.02s;}
  .modal-body > *:nth-child(2){animation-delay:.06s;}
  .modal-body > *:nth-child(3){animation-delay:.10s;}
  .modal-body > *:nth-child(4){animation-delay:.14s;}
  .modal-body > *:nth-child(5){animation-delay:.18s;}
  .modal-body > *:nth-child(6){animation-delay:.22s;}
  .modal-body > *:nth-child(7){animation-delay:.26s;}
  .modal-body > *:nth-child(8){animation-delay:.30s;}
  .modal-body .maker{font-size:12px;}
  .modal-body h2{font-size:22px; font-weight:800; letter-spacing:-0.01em;}
  .modal-body .modal-price{font-size:22px; font-weight:800;}
  .modal-body .modal-rating{font-size:13px; color:var(--muted); font-weight:600;}
  .modal-body .modal-desc{font-size:13.5px; color:var(--muted); line-height:1.55;}
  .modal-stock{font-size:12.5px; font-weight:700; padding:6px 0;}
  .modal-stock.ok{color:var(--green);}
  .modal-stock.low{color:#B45309;}
  .modal-stock.out{color:var(--faint);}
  .modal-qty-row{display:flex; align-items:center; gap:14px; margin-top:6px;}
  .modal-qty-row .qty-row button{width:32px; height:32px; font-size:16px;}
  .modal-qty-row .qty-row span{font-size:15px; min-width:20px;}
  .modal-actions{display:flex; gap:10px; margin-top:8px;}
  .modal-add-btn{
    flex:1; background:var(--ink); color:#fff; border:none; padding:13px;
    border-radius:999px; font-weight:700; font-size:14px; cursor:pointer;
    transition:background .15s ease, transform .1s ease;
  }
  .modal-add-btn:hover{background:#2b2d38;}
  .modal-add-btn:active{transform:scale(0.98);}
  .modal-add-btn:disabled{background:var(--line); color:var(--faint); cursor:not-allowed;}
  .modal-fav-btn{
    width:46px; height:46px; border-radius:999px; border:1.5px solid var(--line);
    background:var(--surface); cursor:pointer; color:var(--ink); flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    transition:transform .15s ease;
  }
  .modal-fav-btn:hover{transform:scale(1.08);}
  .modal-fav-btn.active{color:var(--coral); border-color:var(--coral);}
  .modal-meta{
    display:flex; gap:16px; margin-top:10px; padding-top:14px; border-top:1px solid var(--line);
    font-size:12px; color:var(--muted); font-weight:600;
  }
  .modal-meta span{display:flex; align-items:center; gap:5px;}
  .lock-note{
    font-size:12px; color:var(--accent-ink); background:var(--accent-soft);
    padding:9px 12px; border-radius:8px; font-weight:600;
  }
  .mine-note{
    font-size:12px; color:var(--muted);
    background:var(--bg); padding:11px 12px; border-radius:10px;
    display:flex; flex-direction:column; gap:9px;
  }
  .mine-note-top{display:flex; align-items:center; justify-content:space-between; gap:10px;}
  .mine-note-top .mine-note-actions{display:flex; gap:12px; flex-shrink:0;}
  .mine-note-top button{background:none; border:none; font-weight:700; cursor:pointer; font-size:12px;}
  .mine-note-top .move-btn{color:var(--accent-ink);}
  .mine-note-top .remove-btn{color:var(--coral);}
  .mine-move-row{display:none; gap:8px; align-items:center;}
  .mine-move-row select{
    flex:1; border:1.5px solid var(--line); border-radius:var(--radius-sm);
    padding:7px 9px; font-size:12.5px; color:var(--ink);
  }
  .mine-manage-row{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  .mine-manage-row input{
    width:70px; border:1.5px solid var(--line); border-radius:var(--radius-sm);
    padding:7px 9px; font-size:13px; color:var(--ink);
  }
  .mine-mini-btn{
    border:none; border-radius:999px; padding:7px 13px; font-weight:700; font-size:11.5px;
    cursor:pointer; white-space:nowrap; transition:opacity .15s ease;
  }
  .mine-mini-btn:hover{opacity:0.85;}
  .mine-mini-btn.update{background:var(--accent); color:#fff;}
  .mine-mini-btn.outstock{background:#FFF1E8; color:#B45309;}
  .mine-mini-btn.restock{background:var(--green-soft); color:var(--green);}
  .mine-manage-hint{font-size:11px; color:var(--faint);}

  /* ===== Success modal ===== */
  .success-modal .modal-body{align-items:center; text-align:center; padding:44px 32px;}
  .success-icon{
    width:64px; height:64px; border-radius:999px; background:var(--green-soft);
    display:flex; align-items:center; justify-content:center; margin-bottom:8px;
  }
  .success-modal h2{font-size:20px;}
  .success-modal .order-num{
    font-size:13px; font-weight:700; color:var(--muted); background:var(--bg);
    padding:8px 16px; border-radius:999px; margin:6px 0 2px;
  }
  .success-modal p{font-size:13.5px; color:var(--muted); max-width:360px; line-height:1.5;}
  .success-modal .modal-add-btn{margin-top:10px; max-width:220px;}

  /* ===== Quiz modal ===== */
  .quiz-body, .seller-body{padding:30px 32px 28px; display:flex; flex-direction:column;}
  .quiz-body h2, .seller-body h2{font-size:20px; letter-spacing:-0.01em; margin-bottom:6px;}
  .quiz-sub{font-size:13px; color:var(--muted); line-height:1.5; margin-bottom:20px;}
  .tag-grid{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:8px;}
  .tag-chip{
    padding:9px 14px; border-radius:999px; border:1.5px solid var(--line);
    background:var(--surface); font-size:13px; font-weight:600; color:var(--muted);
    cursor:pointer; display:inline-flex; align-items:center; gap:6px;
    transition:transform .12s ease, border-color .15s ease, background .15s ease, color .15s ease;
  }
  .tag-chip:hover{border-color:var(--faint); transform:translateY(-1px);}
  .tag-chip.active{background:var(--accent-soft); color:var(--accent-ink); border-color:var(--accent);}
  .quiz-actions{display:flex; align-items:center; gap:18px; margin-top:18px;}
  .quiz-skip{background:none; border:none; color:var(--muted); font-weight:600; font-size:13px; cursor:pointer;}
  .quiz-skip:hover{text-decoration:underline;}

  /* ===== Seller modal ===== */
  .seller-body p.intro{font-size:13px; color:var(--muted); margin-bottom:20px; line-height:1.5;}
  .form-group{margin-bottom:14px; display:flex; flex-direction:column; gap:6px;}
  .form-group label{font-size:12.5px; font-weight:700; color:var(--ink);}
  .form-group label span{font-weight:500; color:var(--faint);}
  .form-group input, .form-group select, .form-group textarea{
    border:1.5px solid var(--line); border-radius:var(--radius-sm); padding:10px 12px;
    font-size:13.5px; color:var(--ink); width:100%;
  }
  .form-group select:disabled{background:var(--bg); color:var(--faint);}
  .form-group textarea{resize:vertical; min-height:70px;}
  .form-row{display:flex; gap:12px;}
  .form-row .form-group{flex:1;}
  .stock-hint{font-size:11px; color:var(--faint); margin-top:-2px;}
  .brand-hint{font-size:11px; color:var(--accent-ink); font-weight:600; margin:-6px 0 4px;}
  .seller-connected-note{
    font-size:12px; color:var(--muted); margin-bottom:18px; display:flex; align-items:center;
    justify-content:space-between; background:var(--bg); padding:10px 12px; border-radius:var(--radius-sm);
  }
  .seller-connected-note button{background:none; border:none; color:var(--coral); font-weight:700; cursor:pointer; font-size:11.5px;}
  .google-btn{
    display:flex; align-items:center; justify-content:center; gap:10px; width:100%;
    border:1.5px solid var(--line); background:var(--surface); padding:12px; border-radius:999px;
    font-weight:600; font-size:14px; cursor:pointer; margin-top:6px;
  }
  .google-btn:hover{border-color:var(--ink);}

  .image-upload-row{display:flex; align-items:center; gap:12px;}
  .image-preview{
    width:64px; height:64px; border-radius:10px; background:var(--surface);
    border:1.5px dashed var(--line); display:flex; align-items:center; justify-content:center;
    overflow:hidden; font-size:9.5px; color:var(--faint); text-align:center; flex-shrink:0; padding:4px;
  }
  .image-preview img{width:100%; height:100%; object-fit:cover; border-radius:8px;}
  .upload-btn{
    background:var(--surface); border:1.5px solid var(--line); padding:9px 14px;
    border-radius:999px; font-weight:600; font-size:12.5px; cursor:pointer;
    transition:border-color .15s ease; display:inline-block;
  }
  .upload-btn:hover{border-color:var(--ink);}

  /* ===== Subscribe modal ===== */
  .sub-plans{display:flex; gap:12px; margin:16px 0;}
  .sub-plan-btn{
    flex:1; border:1.5px solid var(--line); border-radius:var(--radius-md); padding:16px;
    background:var(--surface); cursor:pointer; text-align:left;
    transition:border-color .15s ease, transform .15s ease;
  }
  .sub-plan-btn:hover{border-color:var(--accent); transform:translateY(-2px);}
  .sub-plan-name{font-size:13px; font-weight:700; margin-bottom:6px; display:flex; align-items:center; gap:6px;}
  .sub-badge{background:var(--accent-soft); color:var(--accent-ink); font-size:10px; font-weight:700; padding:2px 7px; border-radius:999px;}
  .sub-plan-price{font-size:19px; font-weight:800;}
  .sub-plan-price span{font-size:11px; font-weight:600; color:var(--muted);}
  .sub-perks{display:flex; flex-direction:column; gap:6px; font-size:12.5px; color:var(--muted); font-weight:600; margin-bottom:6px;}
  .sub-fineprint{font-size:11px; color:var(--faint); line-height:1.5;}

  /* ===== Terms box (shared by subscribe + onboarding) ===== */
  .terms-box{
    max-height:220px; overflow-y:auto; background:var(--bg); border-radius:var(--radius-md);
    padding:16px; font-size:12.5px; color:var(--muted); line-height:1.6; display:flex; flex-direction:column; gap:10px;
  }
  .terms-box strong{color:var(--ink);}

  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px);
    background:var(--ink); color:#fff; font-size:13px; font-weight:600;
    padding:12px 20px; border-radius:999px;
    opacity:0; pointer-events:none; transition:all .25s ease; z-index:99;
    max-width:90vw; text-align:center;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  /* ===== Mascot ===== */
  .mascot-wrap{
    position:fixed; left:20px; bottom:20px; z-index:70;
    display:flex; flex-direction:column; align-items:flex-start;
  }
  .mascot-btn{
    width:58px; height:58px; border-radius:999px; border:none; cursor:pointer;
    background:var(--surface); box-shadow:var(--shadow-hover);
    display:flex; align-items:center; justify-content:center;
    animation:mascotFloat 3.2s ease-in-out infinite;
    padding:0;
  }
  .mascot-btn:hover{animation-play-state:paused; transform:translateY(-9px) scale(1.05);}
  .mascot-bubble{
    position:absolute; bottom:74px; left:0; width:230px;
    background:var(--ink); color:#fff; font-size:12.5px; line-height:1.5; font-weight:500;
    padding:13px 30px 13px 15px; border-radius:14px 14px 14px 4px;
    box-shadow:var(--shadow-hover);
    opacity:0; transform:translateY(8px) scale(0.96); transform-origin:bottom left;
    pointer-events:none; transition:opacity .2s ease, transform .2s ease;
  }
  .mascot-bubble.show{opacity:1; transform:translateY(0) scale(1); pointer-events:auto;}
  .mascot-bubble-close{
    position:absolute; top:8px; right:9px; background:none; border:none; color:rgba(255,255,255,0.7);
    font-size:14px; cursor:pointer; line-height:1; padding:2px;
  }
  .mascot-bubble-close:hover{color:#fff;}
  @media (max-width:640px){
    .mascot-wrap{left:14px; bottom:14px;}
    .mascot-btn{width:50px; height:50px;}
    .mascot-bubble{width:190px; bottom:64px;}
  }

  /* ===== Onboarding ===== */
  .onboard-overlay{
    position:fixed; inset:0; z-index:200; background:var(--bg);
    display:flex; align-items:center; justify-content:center;
    padding:24px; transition:opacity .3s ease;
  }
  .onboard-card{
    width:min(560px, 92vw); max-height:88vh; overflow-y:auto;
    background:var(--surface); border-radius:var(--radius-lg); box-shadow:var(--shadow-hover);
    padding:40px 36px; position:relative;
  }
  .onboard-emoji{font-size:44px; margin-bottom:14px;}
  .onboard-card h1{font-size:24px; font-weight:800; letter-spacing:-0.01em; margin-bottom:12px;}
  .onboard-card p{font-size:14px; color:var(--muted); line-height:1.6;}
  .onboard-actions{display:flex; gap:12px; margin-top:26px;}
  .onboard-btn{border:none; border-radius:999px; padding:13px 22px; font-weight:700; font-size:14px; cursor:pointer;}
  .onboard-btn.primary{background:var(--ink); color:#fff; flex:1;}
  .onboard-btn.primary:hover{background:#2b2d38;}
  .onboard-btn.primary:disabled{background:var(--line); color:var(--faint); cursor:not-allowed;}
  .onboard-btn.ghost{background:none; color:var(--muted); font-weight:600;}
  .onboard-btn.ghost:hover{color:var(--ink);}
  .onboard-steps{display:flex; flex-direction:column; gap:16px; margin:20px 0;}
  .onboard-step{display:flex; gap:14px; align-items:flex-start; animation:fadeInUp .4s ease both;}
  .onboard-step span{font-size:24px; flex-shrink:0;}
  .onboard-step strong{font-size:14px; display:block; margin-bottom:2px;}
  .onboard-step p{font-size:12.5px; margin:0;}
  @media (max-width:640px){
    .onboard-card{padding:30px 24px;}
  }

  @media (max-width:900px){
    .layout{flex-direction:column;}
    .filter-toggle{
      display:flex; align-items:center; gap:8px;
      border:1.5px solid var(--line); background:var(--surface);
      padding:9px 16px; border-radius:999px; font-weight:600; font-size:13.5px;
      cursor:pointer; margin-bottom:16px;
    }
    .sidebar{
      position:fixed; top:0; left:0; bottom:0; z-index:92;
      width:min(300px, 85vw);
      background:var(--surface);
      padding:22px; gap:24px;
      transform:translateX(-100%);
      transition:transform .28s cubic-bezier(.4,0,.2,1);
      box-shadow:18px 0 44px rgba(0,0,0,0.16);
      overflow-y:auto;
    }
    .sidebar.open{transform:translateX(0);}
    .sidebar-mobile-head{
      display:flex; align-items:center; justify-content:space-between;
      padding-bottom:14px; margin-bottom:-4px; border-bottom:1px solid var(--line);
    }
    .sidebar-mobile-head span{font-size:16px; font-weight:800; letter-spacing:-0.01em;}
    .sb-block{width:100%;}
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <button class="logo" id="logoBtn"><span class="mark">F</span>Fieldstone</button>
    <div class="search-wrap">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="M21 21l-4.3-4.3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <input id="searchInput" type="text" placeholder="Search products, makers, categories…" aria-label="Search products">
      <button class="search-clear" id="searchClear" aria-label="Clear search">×</button>
    </div>
    <div class="topbar-actions">
      <button class="icon-btn" id="favToggle" aria-label="Show favorites">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 20s-7-4.4-9.5-8.8C.7 7.4 2.7 4 6.2 4c2 0 3.5 1 4.8 2.6C12.3 5 13.8 4 15.8 4c3.5 0 5.5 3.4 3.7 7.2C19 15.6 12 20 12 20z" stroke="currentColor" stroke-width="1.8"/></svg>
        <span class="cart-badge" id="favCount" style="display:none;">0</span>
      </button>
      <button class="icon-btn" aria-label="Account">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="4" stroke="currentColor" stroke-width="2"/><path d="M4 20c1.6-3.6 4.8-5.5 8-5.5s6.4 1.9 8 5.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <button class="icon-btn" id="openCart" aria-label="Open cart">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M3 5h2l2.4 12.1a2 2 0 0 0 2 1.6h8.4a2 2 0 0 0 2-1.6L21 8H6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="9" cy="21" r="1.4" fill="currentColor"/><circle cx="18" cy="21" r="1.4" fill="currentColor"/></svg>
        <span class="cart-badge" id="cartCount">0</span>
      </button>
      <button class="sell-btn" id="sellBtn">List your goods!</button>
    </div>
  </div>
</header>

<div class="layout">
  <button class="filter-toggle" id="filterToggle">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M4 6h16M7 12h10M10 18h4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    Filters
  </button>

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-mobile-head">
      <span>Filters</span>
      <button class="close-btn" id="closeSidebar" aria-label="Close filters">×</button>
    </div>

    <div class="sb-block" id="prefBlock"></div>
    <div class="sb-block" id="subBlock"></div>

    <div class="sb-block">
      <div class="sb-section-title">Category</div>
      <ul class="cat-list" id="catList"></ul>
    </div>

    <div class="sb-block">
      <div class="sb-section-title">Minimum rating</div>
      <div class="rating-stars" id="ratingStars"></div>
      <div class="rating-label" id="ratingLabel">Any rating</div>
    </div>

    <div class="sb-block">
      <div class="sb-section-title">Max price</div>
      <div class="price-slider">
        <input type="range" id="priceRange" min="0" max="100" step="2" value="100">
        <div class="price-labels"><span>$0</span><span id="priceLabel">$100+</span></div>
      </div>
    </div>

    <div class="sb-block">
      <div class="sb-section-title">Availability</div>
      <label class="check-row"><input type="checkbox" id="inStockOnly"> In stock only</label>
    </div>

    <button class="clear-filters" id="clearFilters">Clear all filters</button>
  </aside>

  <main class="content">
    <div class="breadcrumb" id="breadcrumb" style="display:none;">
      <button id="crumbHome">All products</button>
      <span>›</span>
      <span id="crumbCat"></span>
    </div>

    <div class="shop-panel" id="shopPanel">
      <div class="shelf-ribbon" id="shelfRibbon" style="display:none;"></div>

      <div class="content-head">
        <div id="titleBlock">
          <h1 id="resultsLabel">All products</h1>
          <div class="sub" id="resultsCount"></div>
        </div>
        <div class="sort-wrap">
          <select id="sortSelect">
            <option value="featured">Sort: Featured</option>
            <option value="price-asc">Price: Low to High</option>
            <option value="price-desc">Price: High to Low</option>
            <option value="name">Name: A–Z</option>
          </select>
        </div>
      </div>

      <div class="strip-section foryou-section" id="forYouSection" style="display:none;">
        <div class="strip-head">
          <div class="sb-section-title">Picked for you</div>
          <button id="retakeQuiz">Edit preferences</button>
        </div>
        <div class="h-strip" id="forYouStrip"></div>
      </div>

      <div class="grid" id="productGrid"></div>
      <div class="empty-state" id="emptyMsg" style="display:none;">
        <strong id="emptyTitle">Nothing listed yet</strong>
        <span id="emptySub">Be the first — list something and it'll show up right here.</span>
        <br>
        <button class="empty-cta" id="emptyListBtn">List your goods!</button>
      </div>
    </div>

    <div class="strip-section" id="recentSection" style="display:none;">
      <div class="strip-head"><div class="sb-section-title">Recently viewed</div></div>
      <div class="h-strip" id="recentStrip"></div>
    </div>
  </main>
</div>

<div class="overlay" id="overlay"></div>

<aside class="drawer" id="drawer" aria-label="Shopping cart">
  <div class="drawer-head">
    <h2>Your Cart</h2>
    <button class="close-btn" id="closeCart" aria-label="Close cart">×</button>
  </div>
  <div class="ship-progress" id="shipProgress"></div>
  <div class="drawer-items" id="drawerItems"></div>
  <div class="drawer-foot">
    <div id="memberNote"></div>
    <div id="discountSection"></div>
    <div id="totalsBlock"></div>
    <button class="checkout-btn" id="checkoutBtn" disabled>Check out</button>
  </div>
</aside>

<div class="modal" id="quickViewModal" role="dialog" aria-label="Product details"></div>
<div class="modal success-modal" id="successModal" role="dialog" aria-label="Order confirmation"></div>
<div class="modal form-modal" id="quizModal" role="dialog" aria-label="Preferences quiz"></div>
<div class="modal form-modal" id="sellerModal" role="dialog" aria-label="List an item"></div>
<div class="modal form-modal" id="subscribeModal" role="dialog" aria-label="Fieldstone plus membership"></div>

<div class="toast" id="toast"></div>

<div class="mascot-wrap" id="mascotWrap">
  <div class="mascot-bubble" id="mascotBubble"></div>
  <button class="mascot-btn" id="mascotBtn" aria-label="Pebble, your shop assistant">
    <svg width="42" height="42" viewBox="0 0 100 100">
      <defs>
        <linearGradient id="stoneGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#D2C1A3"/>
          <stop offset="100%" stop-color="#A68A63"/>
        </linearGradient>
      </defs>
      <ellipse cx="50" cy="56" rx="37" ry="31" fill="url(#stoneGrad)"/>
      <circle cx="30" cy="62" r="6.5" fill="#FF9E8A" opacity="0.55"/>
      <circle cx="70" cy="62" r="6.5" fill="#FF9E8A" opacity="0.55"/>
      <circle cx="37" cy="50" r="4.5" fill="#12131A"/>
      <circle cx="63" cy="50" r="4.5" fill="#12131A"/>
      <circle cx="38.5" cy="48.5" r="1.4" fill="#fff"/>
      <circle cx="64.5" cy="48.5" r="1.4" fill="#fff"/>
      <path d="M38 66 Q50 76 62 66" stroke="#12131A" stroke-width="3.2" fill="none" stroke-linecap="round"/>
    </svg>
  </button>
</div>

<div class="onboard-overlay" id="onboardOverlay" style="display:none;">
  <div class="onboard-card">
    <div id="onboardPanel"></div>
  </div>
</div>

<script>
  // Catalog starts empty — everything shown comes from real listings via "List your goods!"
  const BASE_PRODUCTS = [];

  const CATEGORY_LIST = ["Kitchen","Garden","Bags","Textiles","Food","Tech","Tools","Furniture","Car","Motorcycle","Watches","Jewelry"];
  const CATEGORY_ICONS = {
    All:"🛍️", Kitchen:"🍽️", Garden:"🌱", Bags:"👜", Textiles:"🧶", Food:"🍯",
    Tech:"💻", Tools:"🛠️", Furniture:"🪑", Car:"🚗", Motorcycle:"🏍️", Watches:"⌚", Jewelry:"💎"
  };
  const CATEGORIES = ["All", ...CATEGORY_LIST];
  const VEHICLE_CATS = ["Car","Motorcycle"];
  const VEHICLE_HIGH_VALUE_THRESHOLD = 100000;
  const VEHICLE_HIGH_VALUE_MIN = 3, VEHICLE_HIGH_VALUE_MAX = 6;
  const BRAND_MIN_PRICE = 100;

  const FREE_SHIP_THRESHOLD = 75;
  const SIZE_LIMITS = {Small:300, Medium:125, Large:80};
  const SUBSCRIPTION_PRICE_THRESHOLD = 60;
  const SUBSCRIPTION_DISCOUNT = 0.10;

  const UNDER30_KEY = "Gifts Under $30";
  const TAG_OPTIONS = [
    {key:"Kitchen & Dining", emoji:"🍽️"},
    {key:"Garden & Outdoor", emoji:"🌱"},
    {key:"Bags & Carry", emoji:"👜"},
    {key:"Home Textiles", emoji:"🧶"},
    {key:"Pantry & Food", emoji:"🍯"},
    {key:"Handforged Metal", emoji:"🔨"},
    {key:"Woodwork", emoji:"🪵"},
    {key:"Ceramics", emoji:"🏺"},
    {key:"Natural Fibers", emoji:"🌾"},
    {key:"Tech & Gadgets", emoji:"💻"},
    {key:"Tools & Hardware", emoji:"🛠️"},
    {key:"Furniture", emoji:"🪑"},
    {key:"Vehicles", emoji:"🚗"},
    {key:"Watches & Jewelry", emoji:"💎"},
    {key:UNDER30_KEY, emoji:"🎁"},
  ];

  const DISCOUNTS = {
    "WELCOME10": {type:"percent", value:10, desc:"10% off your order"},
    "MAKER5": {type:"flat", value:5, minSubtotal:40, desc:"$5 off orders over $40"},
    "FREESHIP": {type:"freeship", value:0, desc:"Free shipping, any order size"},
  };

  const MASCOT_TIPS = [
    "Hi, I'm Pebble 🪨 — your Fieldstone shop assistant. Tap me anytime for a tip!",
    "Spend $75 or more and shipping's on the house.",
    "Try code WELCOME10 at checkout for 10% off your order.",
    "Take the quick quiz in the sidebar — I'll help surface picks made just for you.",
    "Selling something? Look for \"List your goods!\" up top.",
    "Tap the heart on any item to save it to your favorites.",
    "Items $60 and up need a Fieldstone+ membership — members get 10% off everything.",
    "The star filter in the sidebar helps you find the best-rated goods fast.",
  ];

  // ---------- persistence ----------
  function loadState(key, fallback){
    try{
      const raw = localStorage.getItem(key);
      return raw !== null ? JSON.parse(raw) : fallback;
    }catch(e){ return fallback; }
  }
  function saveState(key, value){
    try{ localStorage.setItem(key, JSON.stringify(value)); }catch(e){ /* storage unavailable, fail silently */ }
  }

  let userListings = loadState('fieldstone_listings', []);
  let PRODUCTS = [...BASE_PRODUCTS, ...userListings];

  let cart = loadState('fieldstone_cart', {});
  let favorites = new Set(loadState('fieldstone_favs', []));
  let recentlyViewed = loadState('fieldstone_recent', []);
  let prefs = loadState('fieldstone_prefs', []);
  let appliedDiscount = loadState('fieldstone_discount', null);
  let sellerEmail = loadState('fieldstone_seller_email', null);
  let subscribed = loadState('fieldstone_subscribed', false);
  let subPlan = loadState('fieldstone_sub_plan', null);
  let pendingCartAction = null;
  let subSelectedPlan = null;

  let activeCat = "All";
  let query = "";
  let maxPrice = 100;
  let inStockOnly = false;
  let minRating = 0;
  let sortBy = "featured";
  let showFavsOnly = false;

  const catList = document.getElementById('catList');
  const grid = document.getElementById('productGrid');
  const emptyMsg = document.getElementById('emptyMsg');
  const resultsLabel = document.getElementById('resultsLabel');
  const resultsCount = document.getElementById('resultsCount');
  const breadcrumb = document.getElementById('breadcrumb');
  const crumbCat = document.getElementById('crumbCat');
  const shopPanel = document.getElementById('shopPanel');
  const shelfRibbon = document.getElementById('shelfRibbon');
  const titleBlock = document.getElementById('titleBlock');

  function stockLabel(p){
    if(p.stock <= 0) return {text:"Out of stock", cls:"out"};
    if(p.stock <= 4) return {text:`Only ${p.stock} left`, cls:"low"};
    return {text:"In stock", cls:"ok"};
  }

  function shade(hex, percent){
    const num = parseInt(hex.replace('#',''),16);
    let r = (num>>16) + percent, g = (num>>8 & 0x00FF) + percent, b = (num & 0x0000FF) + percent;
    r = Math.min(255,Math.max(0,r)); g = Math.min(255,Math.max(0,g)); b = Math.min(255,Math.max(0,b));
    return '#' + (0x1000000 + r*0x10000 + g*0x100 + b).toString(16).slice(1);
  }

  function mediaStyleFor(p){
    if(p.image) return `background-image:url('${p.image}');`;
    return `background:linear-gradient(135deg, ${p.color}, ${shade(p.color,-18)});`;
  }

  function isHighValueVehicle(p){
    return VEHICLE_CATS.includes(p.cat) && p.price > VEHICLE_HIGH_VALUE_THRESHOLD;
  }

  function renderCategories(){
    catList.innerHTML = CATEGORIES.map(c=>{
      const count = c === "All" ? PRODUCTS.length : PRODUCTS.filter(p=>p.cat===c).length;
      const icon = CATEGORY_ICONS[c] || "🛍️";
      return `<li><button class="cat-item ${c===activeCat && !showFavsOnly ?'active':''}" data-cat="${c}">
        <span class="cat-left"><span class="cat-icon">${icon}</span>${c}</span>
        <span class="count">${count}</span>
      </button></li>`;
    }).join('');
    catList.querySelectorAll('.cat-item').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        activeCat = btn.dataset.cat;
        showFavsOnly = false;
        renderCategories();
        renderGrid();
        updateBreadcrumb();
        closeSidebar();
      });
    });
  }

  function renderRatingFilter(){
    const container = document.getElementById('ratingStars');
    container.innerHTML = [1,2,3,4,5].map(n=>`<button type="button" class="star-btn ${n<=minRating?'active':''}" data-star="${n}" aria-label="${n} stars and up">★</button>`).join('');
    container.querySelectorAll('.star-btn').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const n = parseInt(btn.dataset.star);
        minRating = (minRating === n) ? 0 : n;
        renderRatingFilter();
        updateRatingLabel();
        renderGrid();
      });
    });
  }
  function updateRatingLabel(){
    document.getElementById('ratingLabel').textContent = minRating === 0 ? 'Any rating' : `${minRating}+ stars`;
  }

  function updateBreadcrumb(){
    if(showFavsOnly){
      breadcrumb.style.display = 'flex';
      crumbCat.textContent = 'Favorites';
    } else if(activeCat !== 'All'){
      breadcrumb.style.display = 'flex';
      crumbCat.textContent = activeCat;
    } else {
      breadcrumb.style.display = 'none';
    }
  }

  function filteredSorted(){
    const effectiveMax = maxPrice >= 100 ? Infinity : maxPrice;
    let items = PRODUCTS.filter(p=>{
      if(showFavsOnly && !favorites.has(p.id)) return false;
      const matchesCat = showFavsOnly || activeCat === 'All' || p.cat === activeCat;
      const matchesQuery = !query || (p.name + p.maker + p.desc).toLowerCase().includes(query.toLowerCase());
      const matchesPrice = p.price <= effectiveMax;
      const matchesStock = !inStockOnly || p.stock > 0;
      const matchesRating = p.rating >= minRating;
      return matchesCat && matchesQuery && matchesPrice && matchesStock && matchesRating;
    });
    if(sortBy === 'price-asc') items.sort((a,b)=>a.price-b.price);
    else if(sortBy === 'price-desc') items.sort((a,b)=>b.price-a.price);
    else if(sortBy === 'name') items.sort((a,b)=>a.name.localeCompare(b.name));
    return items;
  }

  function updateShelf(itemCount){
    if(showFavsOnly){
      shopPanel.classList.add('boxed');
      shelfRibbon.style.display = 'flex';
      shelfRibbon.innerHTML = `<div class="icon">❤️</div><div><h2>Your favorites</h2><p>${itemCount} saved ${itemCount===1?'item':'items'}</p></div>`;
      titleBlock.style.display = 'none';
    } else if(activeCat !== 'All'){
      shopPanel.classList.add('boxed');
      shelfRibbon.style.display = 'flex';
      const icon = CATEGORY_ICONS[activeCat] || '🛍️';
      shelfRibbon.innerHTML = `<div class="icon">${icon}</div><div><h2>${activeCat}</h2><p>${itemCount} ${itemCount===1?'item':'items'} from independent makers</p></div>`;
      titleBlock.style.display = 'none';
    } else {
      shopPanel.classList.remove('boxed');
      shelfRibbon.style.display = 'none';
      titleBlock.style.display = 'block';
    }
  }

  function renderGrid(){
    const items = filteredSorted();
    if(showFavsOnly){
      resultsLabel.textContent = 'Your favorites';
    } else {
      resultsLabel.textContent = activeCat === 'All' ? 'All products' : activeCat;
    }
    resultsCount.textContent = items.length + (items.length === 1 ? ' item' : ' items') + ' found';
    updateShelf(items.length);

    const emptyCta = document.getElementById('emptyListBtn');

    if(items.length === 0){
      grid.style.display = 'none';
      emptyMsg.style.display = 'block';
      if(PRODUCTS.length === 0){
        document.getElementById('emptyTitle').textContent = "Nothing listed yet";
        document.getElementById('emptySub').textContent = "Be the first — list something and it'll show up right here.";
        emptyCta.style.display = 'inline-block';
      } else if(showFavsOnly){
        document.getElementById('emptyTitle').textContent = "No favorites yet";
        document.getElementById('emptySub').textContent = "Tap the heart on any product to save it here.";
        emptyCta.style.display = 'none';
      } else if(query){
        document.getElementById('emptyTitle').textContent = `No results for "${query}"`;
        document.getElementById('emptySub').textContent = "Try a different search term or clear your filters.";
        emptyCta.style.display = 'none';
      } else {
        document.getElementById('emptyTitle').textContent = "No products match your filters";
        document.getElementById('emptySub').textContent = "Try clearing a filter or searching a different term.";
        emptyCta.style.display = 'none';
      }
      renderRecent();
      renderForYou();
      return;
    }
    grid.style.display = 'grid';
    emptyMsg.style.display = 'none';

    grid.innerHTML = items.map((p, idx) => {
      const sl = stockLabel(p);
      const delay = Math.min(idx * 35, 280);
      const locked = p.price > SUBSCRIPTION_PRICE_THRESHOLD && !subscribed;
      return `
      <article class="card" data-open="${p.id}" style="animation-delay:${delay}ms;">
        <div class="card-media">
          <div class="swatch" style="${mediaStyleFor(p)}"></div>
          <div class="badge-stack">
            ${p.isUserListing ? `<span class="badge mine">Your listing</span>` : ''}
            ${locked ? `<span class="badge locked">Fieldstone+</span>` : ''}
            ${sl.cls !== 'ok' ? `<span class="badge ${sl.cls}">${sl.text}</span>` : ''}
          </div>
          <button class="fav-btn ${favorites.has(p.id)?'active':''}" data-fav="${p.id}" aria-label="Save to favorites">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="${favorites.has(p.id)?'currentColor':'none'}"><path d="M12 20s-7-4.4-9.5-8.8C.7 7.4 2.7 4 6.2 4c2 0 3.5 1 4.8 2.6C12.3 5 13.8 4 15.8 4c3.5 0 5.5 3.4 3.7 7.2C19 15.6 12 20 12 20z" stroke="currentColor" stroke-width="1.8"/></svg>
          </button>
          <button class="quick-add" data-id="${p.id}">${p.stock <= 0 ? 'Out of stock' : (locked ? '🔒 Unlock to add' : '+ Quick Add')}</button>
        </div>
        <div class="card-body">
          <div class="maker">${p.maker}</div>
          <h3>${p.name}</h3>
          <div class="desc">${p.desc.split('. ')[0]}.</div>
          <div class="card-foot">
            <span class="price">$${p.price.toLocaleString(undefined,{minimumFractionDigits:2, maximumFractionDigits:2})}</span>
            <span class="rating">★ ${p.rating} <span style="color:var(--faint); font-weight:500;">(${p.reviews})</span></span>
          </div>
        </div>
      </article>
    `}).join('');

    grid.querySelectorAll('.card').forEach(card=>{
      card.addEventListener('click', (e)=>{
        if(e.target.closest('.quick-add') || e.target.closest('.fav-btn')) return;
        openQuickView(parseInt(card.dataset.open));
      });
    });
    grid.querySelectorAll('.quick-add').forEach(btn=>{
      const id = parseInt(btn.dataset.id);
      const prod = PRODUCTS.find(p=>p.id===id);
      if(prod.stock <= 0){ btn.disabled = true; return; }
      btn.addEventListener('click', (e)=>{
        e.stopPropagation();
        const added = addToCart(id, 1);
        if(added){
          btn.textContent = "✓ Added";
          btn.classList.add('added');
          setTimeout(()=>{
            btn.textContent = prod.price > SUBSCRIPTION_PRICE_THRESHOLD && !subscribed ? '🔒 Unlock to add' : '+ Quick Add';
            btn.classList.remove('added');
          }, 900);
        }
      });
    });
    grid.querySelectorAll('.fav-btn').forEach(btn=>{
      btn.addEventListener('click', (e)=>{
        e.stopPropagation();
        toggleFavorite(parseInt(btn.dataset.fav));
      });
    });

    renderRecent();
    renderForYou();
  }

  document.getElementById('emptyListBtn').addEventListener('click', openSeller);

  // ---------- preferences quiz ----------
  let tempPrefs = new Set(prefs);

  function getPreferenceMatches(){
    if(prefs.length===0) return [];
    return PRODUCTS.map(p=>{
      let score = 0;
      prefs.forEach(t=>{
        if(t === UNDER30_KEY){ if(p.price < 30) score++; }
        else if((p.tags||[]).includes(t)) score++;
      });
      return {p, score};
    }).filter(x=>x.score>0).sort((a,b)=> b.score-a.score || b.p.rating-a.p.rating).map(x=>x.p);
  }

  function renderForYou(){
    const section = document.getElementById('forYouSection');
    const strip = document.getElementById('forYouStrip');
    const matches = getPreferenceMatches().slice(0,8);
    if(prefs.length===0 || matches.length===0){ section.style.display='none'; return; }
    section.style.display='block';
    strip.innerHTML = matches.map(p=>`
      <div class="strip-card" data-open="${p.id}">
        <div class="swatch" style="${mediaStyleFor(p)}"></div>
        <div class="sc-body">
          <h4>${p.name}</h4>
          <span class="price">$${p.price.toLocaleString()}</span>
        </div>
      </div>
    `).join('');
    strip.querySelectorAll('.strip-card').forEach(c=> c.addEventListener('click', ()=> openQuickView(parseInt(c.dataset.open))));
  }

  function renderPrefBlock(){
    const block = document.getElementById('prefBlock');
    if(prefs.length === 0){
      block.innerHTML = `
        <div class="pref-card">
          <h4>🎯 What are you into?</h4>
          <p>Take a 30-second quiz and we'll surface picks made for you.</p>
          <button class="take-quiz-btn" id="takeQuizBtn">Take the quiz</button>
        </div>
      `;
      document.getElementById('takeQuizBtn').addEventListener('click', openQuiz);
    } else {
      block.innerHTML = `
        <div class="pref-card">
          <h4>🎯 Picked for you</h4>
          <div class="pref-chips">${prefs.map(p=>`<span class="pref-chip-mini">${p}</span>`).join('')}</div>
          <div class="pref-edit-row">
            <button id="editPrefsBtn">Edit</button>
            <button id="clearPrefsBtn">Clear</button>
          </div>
        </div>
      `;
      document.getElementById('editPrefsBtn').addEventListener('click', openQuiz);
      document.getElementById('clearPrefsBtn').addEventListener('click', ()=>{
        prefs = [];
        saveState('fieldstone_prefs', prefs);
        renderPrefBlock();
        renderGrid();
      });
    }
  }

  function openQuiz(){
    tempPrefs = new Set(prefs);
    renderQuizModal();
    openOverlayFor(document.getElementById('quizModal'));
  }

  function renderQuizModal(){
    const modal = document.getElementById('quizModal');
    modal.innerHTML = `
      <button class="modal-close" id="quizClose" aria-label="Close">×</button>
      <div class="quiz-body">
        <h2>What do you like to see in Fieldstone?</h2>
        <p class="quiz-sub">Pick a few things you're into — we'll surface picks that match, right on the shop page.</p>
        <div class="tag-grid" id="tagGrid">
          ${TAG_OPTIONS.map(t=>`<button type="button" class="tag-chip ${tempPrefs.has(t.key)?'active':''}" data-tag="${t.key}">${t.emoji} ${t.key}</button>`).join('')}
        </div>
        <div class="quiz-actions">
          <button class="modal-add-btn" id="quizConfirm" style="flex:0 0 auto; padding:12px 22px;">Show me picks</button>
          <button class="quiz-skip" id="quizSkip">Skip for now</button>
        </div>
      </div>
    `;
    modal.querySelectorAll('.tag-chip').forEach(chip=>{
      chip.addEventListener('click', ()=>{
        const tag = chip.dataset.tag;
        if(tempPrefs.has(tag)) tempPrefs.delete(tag); else tempPrefs.add(tag);
        chip.classList.toggle('active');
      });
    });
    document.getElementById('quizClose').addEventListener('click', closeAllModals);
    document.getElementById('quizSkip').addEventListener('click', closeAllModals);
    document.getElementById('quizConfirm').addEventListener('click', ()=>{
      prefs = Array.from(tempPrefs);
      saveState('fieldstone_prefs', prefs);
      closeAllModals();
      renderPrefBlock();
      renderGrid();
      if(prefs.length>0) showToast("Picks made for you are ready below");
    });
  }
  document.getElementById('retakeQuiz').addEventListener('click', openQuiz);

  // ---------- Fieldstone+ subscription ----------
  function renderSubBlock(){
    const block = document.getElementById('subBlock');
    if(subscribed){
      block.innerHTML = `
        <div class="pref-card member">
          <h4>✓ Fieldstone+ member</h4>
          <p>10% off every order, items $${SUBSCRIPTION_PRICE_THRESHOLD}+ unlocked, and free member codes. Billed ${subPlan==='yearly' ? '$399/year' : '$39.99/week'}.</p>
          <div class="pref-edit-row"><button id="cancelSubBtn" style="color:var(--coral);">Cancel membership</button></div>
        </div>
      `;
      document.getElementById('cancelSubBtn').addEventListener('click', ()=>{
        subscribed = false; subPlan = null;
        saveState('fieldstone_subscribed', false);
        saveState('fieldstone_sub_plan', null);
        renderSubBlock();
        renderGrid();
        updateCartUI();
        showToast("Fieldstone+ membership canceled");
      });
    } else {
      block.innerHTML = `
        <div class="pref-card">
          <h4>🔒 Fieldstone+</h4>
          <p>Required to buy items $${SUBSCRIPTION_PRICE_THRESHOLD}+. Members get 10% off and free bonus codes.</p>
          <button class="take-quiz-btn" id="viewSubBtn">See plans</button>
        </div>
      `;
      document.getElementById('viewSubBtn').addEventListener('click', ()=>{
        pendingCartAction = null;
        renderSubscribeModal('plans');
        openOverlayFor(document.getElementById('subscribeModal'));
      });
    }
  }

  function openSubscribeModal(id, qty){
    pendingCartAction = {id, qty};
    renderSubscribeModal('plans');
    openOverlayFor(document.getElementById('subscribeModal'));
  }

  function subPlanLabel(plan){
    return plan === 'yearly' ? '$399/year' : '$39.99/week';
  }

  function renderSubscribeModal(step){
    const modal = document.getElementById('subscribeModal');

    if(step === 'plans'){
      modal.innerHTML = `
        <button class="modal-close" id="subClose" aria-label="Close">×</button>
        <div class="seller-body">
          <h2>🔒 Fieldstone+ required</h2>
          <p class="intro">Items $${SUBSCRIPTION_PRICE_THRESHOLD} and up are reserved for Fieldstone+ members. Subscribe to unlock this item, plus an automatic 10% member discount on every order.</p>
          <div class="sub-plans">
            <button class="sub-plan-btn" id="subWeekly">
              <div class="sub-plan-name">Weekly</div>
              <div class="sub-plan-price">$39.99<span>/week</span></div>
            </button>
            <button class="sub-plan-btn" id="subYearly">
              <div class="sub-plan-name">Yearly <span class="sub-badge">Best value</span></div>
              <div class="sub-plan-price">$399<span>/year</span></div>
            </button>
          </div>
          <div class="sub-perks">

  function activateSubscription(plan){
    subscribed = true;
    subPlan = plan;
    saveState('fieldstone_subscribed', true);
    saveState('fieldstone_sub_plan', plan);
    subSelectedPlan = null;
    closeAllModals();
    renderSubBlock();
    renderGrid();
    updateCartUI();
    showToast(`🎉 Fieldstone+ activated — ${subPlanLabel(plan)}`);
    if(pendingCartAction){
      addToCart(pendingCartAction.id, pendingCartAction.qty, true);
      pendingCartAction = null;
    }
  }

  // ---------- favorites ----------
  function toggleFavorite(id){
    if(favorites.has(id)) favorites.delete(id);
    else favorites.add(id);
    saveState('fieldstone_favs', Array.from(favorites));
    updateFavUI();
    renderGrid();
    refreshOpenModal(id);
  }
  function updateFavUI(){
    const count = favorites.size;
    const favCountEl = document.getElementById('favCount');
    const favToggleBtn = document.getElementById('favToggle');
    if(count > 0){ favCountEl.style.display='flex'; favCountEl.textContent = count; }
    else favCountEl.style.display = 'none';
    favToggleBtn.classList.toggle('fav-active', showFavsOnly);
  }
  document.getElementById('favToggle').addEventListener('click', ()=>{
    showFavsOnly = !showFavsOnly;
    updateFavUI();
    renderCategories();
    renderGrid();
    updateBreadcrumb();
  });

  // ---------- recently viewed ----------
  function pushRecent(id){
    recentlyViewed = [id, ...recentlyViewed.filter(x=>x!==id)].slice(0,8);
    saveState('fieldstone_recent', recentlyViewed);
  }
  function renderRecent(){
    const section = document.getElementById('recentSection');
    const strip = document.getElementById('recentStrip');
    const items = recentlyViewed.map(id=>PRODUCTS.find(p=>p.id===id)).filter(Boolean);
    if(items.length === 0){ section.style.display = 'none'; return; }
    section.style.display = 'block';
    strip.innerHTML = items.map(p=>`
      <div class="strip-card" data-open="${p.id}">
        <div class="swatch" style="${mediaStyleFor(p)}"></div>
        <div class="sc-body">
          <h4>${p.name}</h4>
          <span class="price">$${p.price.toLocaleString()}</span>
        </div>
      </div>

    strip.querySelectorAll('.strip-card').forEach(c=>{
      c.addEventListener('click', ()=> openQuickView(parseInt(c.dataset.open)));
    });

  // ---------- cart ----------
  function addToCart(id, qty, bypassGate){
    const prod = PRODUCTS.find(p=>p.id===id);
    if(!prod) return false;
    if(!bypassGate && prod.price > SUBSCRIPTION_PRICE_THRESHOLD && !subscribed){
      openSubscribeModal(id, qty);
      return false;
    }
    const current = cart[id] || 0;
    const next = Math.min(current + qty, prod.stock);
    cart[id] = next;
    saveState('fieldstone_cart', cart);
    updateCartUI();
    showToast(`${prod.name} added to cart`);
    return true;
  }
  function changeQty(id, delta){
    const prod = PRODUCTS.find(p=>p.id===parseInt(id));
    let next = (cart[id] || 0) + delta;
    next = Math.min(next, prod.stock);
    if(next <= 0) delete cart[id];
    else cart[id] = next;
    saveState('fieldstone_cart', cart);
    updateCartUI();
  }
  function removeItem(id){
    delete cart[id];
    saveState('fieldstone_cart', cart);
    updateCartUI();
  }

  function cartTotal(){
    return Object.entries(cart).reduce((sum,[id,qty])=>{
      const p = PRODUCTS.find(pr=>pr.id === parseInt(id));
      return p ? sum + p.price*qty : sum;
    },0);
  }

  function computeTotals(){
    const subtotal = cartTotal();
    let codeDiscount = 0;
    let freeshipForced = false;
    if(appliedDiscount && DISCOUNTS[appliedDiscount]){
      const d = DISCOUNTS[appliedDiscount];
      if(d.type === 'percent') codeDiscount = subtotal * d.value / 100;
      else if(d.type === 'flat') codeDiscount = Math.min(d.value, subtotal);
      else if(d.type === 'freeship') freeshipForced = true;
    }
    const memberDiscount = subscribed ? subtotal * SUBSCRIPTION_DISCOUNT : 0;
    const discountAmount = Math.min(codeDiscount + memberDiscount, subtotal);
    const total = Math.max(0, subtotal - discountAmount);
    return {subtotal, codeDiscount, memberDiscount, discountAmount, total, freeshipForced};
  }

  function applyDiscountCode(rawCode){
    const code = (rawCode || '').trim().toUpperCase();
    const errEl = document.getElementById('discountError');
    if(!code) return;
    const d = DISCOUNTS[code];
    if(!d){
      if(errEl){ errEl.textContent = "That code isn't valid."; errEl.style.display = 'block'; }
      return;
    }
    const subtotal = cartTotal();
    if(d.minSubtotal && subtotal < d.minSubtotal){
      if(errEl){ errEl.textContent = `Add $${(d.minSubtotal - subtotal).toFixed(2)} more to use this code.`; errEl.style.display = 'block'; }
      return;
    }
    appliedDiscount = code;
    saveState('fieldstone_discount', appliedDiscount);
    updateCartUI();
    showToast(`Code ${code} applied — ${d.desc}`);
  }
  function removeDiscount(){
    appliedDiscount = null;
    saveState('fieldstone_discount', null);
    updateCartUI();
  }

  function updateCartUI(){
    const count = Object.values(cart).reduce((a,b)=>a+b,0);
    document.getElementById('cartCount').textContent = count;

    const drawerItems = document.getElementById('drawerItems');
    const ids = Object.keys(cart).filter(id => cart[id] > 0);
    if(ids.length === 0){
      drawerItems.innerHTML = `<div class="drawer-empty">Your cart is empty.</div>`;
    } else {
      drawerItems.innerHTML = ids.map(id=>{
        const p = PRODUCTS.find(pr=>pr.id === parseInt(id));
        const qty = cart[id];
        return `
          <div class="drawer-item">
            <div class="swatch" style="${mediaStyleFor(p)}"></div>
            <div class="di-info">
              <div class="maker">${p.maker}</div>
              <h4 data-open="${id}">${p.name}</h4>
              <div class="qty-row">
                <button data-id="${id}" data-delta="-1" aria-label="Decrease quantity">−</button>
                <span>${qty}</span>
                <button data-id="${id}" data-delta="1" aria-label="Increase quantity" ${qty>=p.stock?'disabled style="opacity:.4;cursor:not-allowed;"':''}>+</button>
              </div>
              <button class="remove-link" data-remove="${id}">Remove</button>
            </div>
            <div class="di-price">$${(p.price*qty).toLocaleString(undefined,{minimumFractionDigits:2, maximumFractionDigits:2})}</div>
          </div>
        `;
      }).join('');
      drawerItems.querySelectorAll('[data-delta]').forEach(b=>{
        b.addEventListener('click', ()=> changeQty(b.dataset.id, parseInt(b.dataset.delta)));
      });
      drawerItems.querySelectorAll('[data-remove]').forEach(b=>{
        b.addEventListener('click', ()=> removeItem(b.dataset.remove));
      });
      drawerItems.querySelectorAll('.di-info h4').forEach(h=>{
        h.addEventListener('click', ()=>{ closeDrawer(); openQuickView(parseInt(h.dataset.open)); });
      });
    }

    const {subtotal, codeDiscount, memberDiscount, total, freeshipForced} = computeTotals();

    const memberNoteEl = document.getElementById('memberNote');
    memberNoteEl.innerHTML = subscribed ? `<div class="member-note">✓ Fieldstone+ member — 10% off is already applied below.</div>` : '';

    const discountSection = document.getElementById('discountSection');
    if(appliedDiscount && DISCOUNTS[appliedDiscount]){
      discountSection.innerHTML = `
        <div class="discount-applied">
          <span>✓ ${appliedDiscount} applied — ${DISCOUNTS[appliedDiscount].desc}</span>
          <button id="removeDiscountBtn">Remove</button>
        </div>
      `;
      document.getElementById('removeDiscountBtn').addEventListener('click', removeDiscount);
    } else {
      discountSection.innerHTML = `
        <div class="discount-row">
          <input type="text" id="discountInput" placeholder="Discount code">
          <button id="discountApplyBtn">Apply</button>
        </div>
        <div class="discount-error" id="discountError" style="display:none;"></div>
      `;
      const applyBtn = document.getElementById('discountApplyBtn');
      const input = document.getElementById('discountInput');
      applyBtn.addEventListener('click', ()=> applyDiscountCode(input.value));
      input.addEventListener('keydown', (e)=>{
        if(e.key === 'Enter'){ e.preventDefault(); applyDiscountCode(input.value); }
      });
    }

    const totalsBlock = document.getElementById('totalsBlock');
    let rows = `<div class="total-row"><span>Subtotal</span><span>$${subtotal.toLocaleString(undefined,{minimumFractionDigits:2, maximumFractionDigits:2})}</span></div>`;
    if(codeDiscount > 0){
      rows += `<div class="total-row discount"><span>Discount</span><span>−$${codeDiscount.toFixed(2)}</span></div>`;
    }
    if(memberDiscount > 0){
      rows += `<div class="total-row discount"><span>Fieldstone+ (10%)</span><span>−$${memberDiscount.toFixed(2)}</span></div>`;
    }
    rows += `<div class="total-row grand"><span>Total</span><span>$${total.toLocaleString(undefined,{minimumFractionDigits:2, maximumFractionDigits:2})}</span></div>`;
    rows += `<div class="total-sub">Shipping and taxes calculated at checkout.</div>`;
    totalsBlock.innerHTML = rows;

    document.getElementById('checkoutBtn').disabled = ids.length === 0;

    const shipEl = document.getElementById('shipProgress');
    if(ids.length === 0){
      shipEl.innerHTML = '';
    } else if(freeshipForced || subtotal >= FREE_SHIP_THRESHOLD){
      shipEl.innerHTML = `
        <div class="msg"><strong>✓ Free shipping${freeshipForced ? ' from your code' : ''}!</strong></div>
        <div class="ship-bar"><div class="ship-bar-fill" style="width:100%;"></div></div>
      `;
    } else {
      const remaining = (FREE_SHIP_THRESHOLD - subtotal).toFixed(2);
      const pct = Math.min(100, (subtotal/FREE_SHIP_THRESHOLD)*100);
      shipEl.innerHTML = `
        <div class="msg">Add <strong style="color:var(--accent);">$${remaining}</strong> more for free shipping</div>
        <div class="ship-bar"><div class="ship-bar-fill" style="width:${pct}%;"></div></div>
      `;
    }
  }

  document.getElementById('checkoutBtn').addEventListener('click', ()=>{
    if(Object.keys(cart).length === 0) return;
    const orderNum = 'FS-' + Math.floor(100000 + Math.random()*899999);
    const {total} = computeTotals();
    closeDrawer();
    showSuccessModal(orderNum, total);
    cart = {};
    saveState('fieldstone_cart', cart);
    appliedDiscount = null;
    saveState('fieldstone_discount', null);
    updateCartUI();
  });
