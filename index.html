  // ---------- quick view modal ----------
  let currentModalId = null;
  let modalQty = 1;
  let currentGalleryViews = [];
  let modalGalleryIndex = 0;

  function galleryViews(color){
    return [
      `linear-gradient(135deg, ${color}, ${shade(color,-18)})`,
      `linear-gradient(135deg, ${shade(color,22)}, ${color})`,
      `linear-gradient(135deg, ${shade(color,-38)}, ${shade(color,-12)})`,
      `linear-gradient(150deg, ${color}, ${shade(color,38)})`,
    ];
  }

  function openQuickView(id){
    currentModalId = id;
    modalQty = 1;
    modalGalleryIndex = 0;
    pushRecent(id);
    renderQuickView();
    openOverlayFor(document.getElementById('quickViewModal'));
  }
  function refreshOpenModal(id){
    if(currentModalId === id) renderQuickView();
  }
  function renderQuickView(){
    const p = PRODUCTS.find(pr=>pr.id===currentModalId);
    if(!p) return;
    const modal = document.getElementById('quickViewModal');
    const sl = stockLabel(p);
    modalQty = Math.min(modalQty, Math.max(p.stock,1));
    const hasImage = !!p.image;
    currentGalleryViews = hasImage ? [] : galleryViews(p.color);
    const mediaBg = hasImage ? `background-image:url('${p.image}');` : `background:${currentGalleryViews[modalGalleryIndex]};`;
    const highValueVehicle = isHighValueVehicle(p);
    const stockLimit = highValueVehicle ? VEHICLE_HIGH_VALUE_MAX : (SIZE_LIMITS[p.size] || 125);
    const stockHintText = highValueVehicle
      ? `Vehicles over $${VEHICLE_HIGH_VALUE_THRESHOLD.toLocaleString()} are limited to ${VEHICLE_HIGH_VALUE_MIN}–${VEHICLE_HIGH_VALUE_MAX} in stock.`
      : `Max ${stockLimit} in stock for ${p.size ? p.size.toLowerCase() : 'this'} items.`;
    const locked = p.price > SUBSCRIPTION_PRICE_THRESHOLD && !subscribed;
    modal.innerHTML = `
      <button class="modal-close" id="qvClose" aria-label="Close">×</button>
      <div class="modal-grid">
        <div class="modal-media-wrap">
          <div class="modal-media" id="qvMainImage" style="${mediaBg}"></div>
          ${!hasImage ? `
            <div class="gallery-thumbs" id="qvThumbs">
              ${currentGalleryViews.map((v,i)=>`<button type="button" class="thumb ${i===modalGalleryIndex?'active':''}" data-idx="${i}" style="background:${v};" aria-label="View ${i+1}"></button>`).join('')}
            </div>
          ` : ''}
        </div>
        <div class="modal-body">
          <div class="maker">${p.maker}</div>
          <h2>${p.name}</h2>
          <div style="display:flex; align-items:center; gap:10px;">
            <span class="modal-price">$${p.price.toLocaleString(undefined,{minimumFractionDigits:2, maximumFractionDigits:2})}</span>
            <span class="modal-rating">★ ${p.rating} · ${p.reviews} reviews</span>
          </div>
          <div class="modal-desc">${p.desc}</div>
          <div class="modal-stock ${sl.cls}">${sl.cls==='ok' ? `✓ ${sl.text} — ships in 2–4 days` : sl.text}</div>
          ${locked ? `<div class="lock-note">🔒 Fieldstone+ membership required to purchase this item ($${SUBSCRIPTION_PRICE_THRESHOLD}+).</div>` : ''}
          ${p.isUserListing ? `
            <div class="mine-note">
              <div class="mine-note-top">
                <span>This is your listing${p.size ? ` · ${p.size} item` : ''}</span>
                <div class="mine-note-actions">
                  <button class="move-btn" id="qvMoveCat">Move category</button>
                  <button class="remove-btn" id="qvRemove">Remove</button>
                </div>
              </div>
              <div class="mine-move-row" id="qvMoveRow">
                <select id="qvMoveSelect">${CATEGORY_LIST.map(c=>`<option value="${c}" ${c===p.cat?'selected':''}>${c}</option>`).join('')}</select>
                <button type="button" class="mine-mini-btn update" id="qvMoveConfirm">Move</button>
              </div>
              <div class="mine-manage-row">
                <input type="number" id="qvStockInput" min="0" max="${stockLimit}" value="${p.stock}">
                <button type="button" class="mine-mini-btn update" id="qvUpdateStock">Update stock</button>
                <button type="button" class="mine-mini-btn ${p.stock<=0?'restock':'outstock'}" id="qvToggleStock">${p.stock<=0?'Restock':'Mark out of stock'}</button>
              </div>
              <div class="mine-manage-hint">${stockHintText}</div>
            </div>
          ` : ''}
          <div class="modal-qty-row">
            <div class="qty-row">
              <button id="qvMinus" aria-label="Decrease quantity" ${p.stock<=0?'disabled':''}>−</button>
              <span id="qvQty">${p.stock>0?modalQty:0}</span>
              <button id="qvPlus" aria-label="Increase quantity" ${p.stock<=0 || modalQty>=p.stock?'disabled':''}>+</button>
            </div>
          </div>
          <div class="modal-actions">
            <button class="modal-add-btn" id="qvAdd" ${p.stock<=0?'disabled':''}>${p.stock<=0?'Out of stock':(locked?'🔒 Unlock with Fieldstone+':'Add to cart')}</button>
            <button class="modal-fav-btn ${favorites.has(p.id)?'active':''}" id="qvFav" aria-label="Save to favorites">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="${favorites.has(p.id)?'currentColor':'none'}"><path d="M12 20s-7-4.4-9.5-8.8C.7 7.4 2.7 4 6.2 4c2 0 3.5 1 4.8 2.6C12.3 5 13.8 4 15.8 4c3.5 0 5.5 3.4 3.7 7.2C19 15.6 12 20 12 20z" stroke="currentColor" stroke-width="1.8"/></svg>
            </button>
          </div>
          <div class="modal-meta">
            <span>🚚 Free shipping over $${FREE_SHIP_THRESHOLD}</span>
            <span>↩ 30-day returns</span>
          </div>
        </div>
      </div>
    `;
    document.getElementById('qvClose').addEventListener('click', closeAllModals);
    document.getElementById('qvFav').addEventListener('click', ()=> toggleFavorite(p.id));
    if(p.isUserListing){
      document.getElementById('qvRemove').addEventListener('click', ()=> removeListing(p.id));
      document.getElementById('qvMoveCat').addEventListener('click', ()=>{
        const row = document.getElementById('qvMoveRow');
        row.style.display = row.style.display === 'flex' ? 'none' : 'flex';
      });
      document.getElementById('qvMoveConfirm').addEventListener('click', ()=>{
        const newCat = document.getElementById('qvMoveSelect').value;
        moveListingCategory(p.id, newCat);
      });
      document.getElementById('qvUpdateStock').addEventListener('click', ()=>{
        const val = parseInt(document.getElementById('qvStockInput').value);
        updateListingStock(p.id, val);
      });
      document.getElementById('qvToggleStock').addEventListener('click', ()=>{
        if(p.stock <= 0){
          const restoreQty = clampStock(p, p.lastStock && p.lastStock>0 ? p.lastStock : (highValueVehicle ? VEHICLE_HIGH_VALUE_MIN : Math.min(5, stockLimit)));
          updateListingStock(p.id, restoreQty);
        } else {
          markListingOutOfStock(p.id);
        }
      });
    }
    if(!hasImage){
      document.querySelectorAll('#qvThumbs .thumb').forEach(t=>{
        t.addEventListener('click', ()=> selectGalleryView(parseInt(t.dataset.idx)));
      });
    }
    const minus = document.getElementById('qvMinus');
    const plus = document.getElementById('qvPlus');
    const qtySpan = document.getElementById('qvQty');
    minus.addEventListener('click', ()=>{
      if(modalQty > 1){ modalQty--; qtySpan.textContent = modalQty; renderQuickViewButtons(p); }
    });
    plus.addEventListener('click', ()=>{
      if(modalQty < p.stock){ modalQty++; qtySpan.textContent = modalQty; renderQuickViewButtons(p); }
    });
    document.getElementById('qvAdd').addEventListener('click', ()=>{
      if(p.stock <= 0) return;
      const added = addToCart(p.id, modalQty);
      if(added) closeAllModals();
    });
  }
  function selectGalleryView(idx){
    modalGalleryIndex = idx;
    const mainImg = document.getElementById('qvMainImage');
    if(!mainImg) return;
    mainImg.style.opacity = 0;
    setTimeout(()=>{
      mainImg.style.background = currentGalleryViews[idx];
      mainImg.style.opacity = 1;
    }, 150);
    document.querySelectorAll('#qvThumbs .thumb').forEach((t,i)=> t.classList.toggle('active', i===idx));
  }
  function renderQuickViewButtons(p){
    document.getElementById('qvPlus').disabled = modalQty >= p.stock;
  }

  // ---------- seller inventory management ----------
  function clampStock(product, val){
    if(isNaN(val) || val < 0) val = 0;
    if(val === 0) return 0;
    if(isHighValueVehicle(product)){
      return Math.min(Math.max(val, VEHICLE_HIGH_VALUE_MIN), VEHICLE_HIGH_VALUE_MAX);
    }
    const limit = SIZE_LIMITS[product.size] || 125;
    return Math.min(val, limit);
  }
  function syncListingToStorage(product){
    const uIdx = userListings.findIndex(p=>p.id===product.id);
    if(uIdx !== -1){ userListings[uIdx] = product; saveState('fieldstone_listings', userListings); }
  }
  function updateListingStock(id, val){
    const idx = PRODUCTS.findIndex(p=>p.id===id);
    if(idx === -1) return;
    const clamped = clampStock(PRODUCTS[idx], val);
    PRODUCTS[idx].stock = clamped;
    if(clamped > 0) PRODUCTS[idx].lastStock = clamped;
    syncListingToStorage(PRODUCTS[idx]);
    refreshOpenModal(id);
    renderCategories();
    renderGrid();
    showToast(clamped > 0 ? `Stock updated to ${clamped}` : "Marked out of stock");
  }
  function markListingOutOfStock(id){
    const idx = PRODUCTS.findIndex(p=>p.id===id);
    if(idx === -1) return;
    if(PRODUCTS[idx].stock > 0) PRODUCTS[idx].lastStock = PRODUCTS[idx].stock;
    PRODUCTS[idx].stock = 0;
    syncListingToStorage(PRODUCTS[idx]);
    refreshOpenModal(id);
    renderCategories();
    renderGrid();
    showToast("Marked out of stock");
  }
  function moveListingCategory(id, newCat){
    const idx = PRODUCTS.findIndex(pr=>pr.id===id);
    if(idx === -1) return;
    const product = PRODUCTS[idx];
    if(product.cat === newCat){ showToast(`Already in ${newCat}`); return; }
    const nowVehicle = VEHICLE_CATS.includes(newCat);
    if(nowVehicle && (!product.image || product.price <= BRAND_MIN_PRICE)){
      showToast(`Can't move to ${newCat} — vehicles need a photo and a price above $${BRAND_MIN_PRICE}.`);
      return;
    }
    product.cat = newCat;
    if(nowVehicle){
      product.size = 'Large';
      product.stock = clampStock(product, product.stock);
    }
    syncListingToStorage(product);
    refreshOpenModal(id);
    renderCategories();
    renderGrid();
    showToast(`Moved to ${newCat}`);
  }

        chip.addEventListener('click', ()=>{

          if(sellerTags.has(tag)) sellerTags.delete(tag); else sellerTags.add(tag);

      document.getElementById('fPrice').addEventListener('input', refreshFormHints);

  function refreshFormHints(){
    const cat = document.getElementById('fCat').value;
    const isVehicle = VEHICLE_CATS.includes(cat);
    const price = parseFloat(document.getElementById('fPrice').value) || 0;
    const sizeSelect = document.getElementById('fSize');
    sizeSelect.disabled = isVehicle;
    if(isVehicle) sizeSelect.value = 'Large';
    const size = sizeSelect.value;

    const stockInput = document.getElementById('fStock');
    const stockHint = document.getElementById('stockHint');
    if(isVehicle && price > VEHICLE_HIGH_VALUE_THRESHOLD){
      stockInput.max = VEHICLE_HIGH_VALUE_MAX;
      stockHint.textContent = `Vehicles over $${VEHICLE_HIGH_VALUE_THRESHOLD.toLocaleString()} are limited to ${VEHICLE_HIGH_VALUE_MIN}–${VEHICLE_HIGH_VALUE_MAX} in stock.`;
    } else {
      const limit = SIZE_LIMITS[size];
      stockInput.max = limit;
      stockHint.textContent = `Max ${limit} for ${size.toLowerCase()} items`;
    }

    const brandCheckbox = document.getElementById('fBrand');
    if(isVehicle){ brandCheckbox.checked = true; brandCheckbox.disabled = true; }
    else{ brandCheckbox.disabled = false; }
    const brandRequired = isVehicle || brandCheckbox.checked;
    document.getElementById('brandHint').style.display = brandRequired ? 'block' : 'none';
  }

  function handleImageUpload(e){
    const file = e.target.files[0];
    const errEl = document.getElementById('imageError');
    errEl.style.display = 'none';
    if(!file) return;
    if(!file.type.startsWith('image/')){
      errEl.textContent = "Please choose an image file.";
      errEl.style.display = 'block';
      return;
    }
    if(file.size > 8 * 1024 * 1024){
      errEl.textContent = "That image is too large — please choose one under 8MB.";
      errEl.style.display = 'block';
      return;
    }
    const reader = new FileReader();
    reader.onload = (ev)=>{
      const img = new Image();
      img.onload = ()=>{
        const maxDim = 640;
        let w = img.width, h = img.height;
        if(w > h && w > maxDim){ h = Math.round(h * maxDim / w); w = maxDim; }
        else if(h >= w && h > maxDim){ w = Math.round(w * maxDim / h); h = maxDim; }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        const dataUrl = canvas.toDataURL('image/jpeg', 0.82);
        pendingImageDataUrl = dataUrl;
        const preview = document.getElementById('imagePreview');
        if(preview) preview.innerHTML = `<img src="${dataUrl}" alt="Preview">`;
      };
      img.onerror = ()=>{
        errEl.textContent = "Couldn't read that image — please try another file.";
        errEl.style.display = 'block';
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  }

  function submitListing(){
    const name = document.getElementById('fName').value.trim();
    const price = parseFloat(document.getElementById('fPrice').value);
    const cat = document.getElementById('fCat').value;
    let size = document.getElementById('fSize').value;
    let stock = parseInt(document.getElementById('fStock').value);
    const maker = document.getElementById('fMaker').value.trim() || sellerEmail.split('@')[0];
    const desc = document.getElementById('fDesc').value.trim() || "A handmade piece from an independent Fieldstone maker.";
    const color = document.getElementById('fColor').value;
    const isBrandChecked = document.getElementById('fBrand').checked;
    const errEl = document.getElementById('listingError');
    const isVehicle = VEHICLE_CATS.includes(cat);

    if(!name || !price || price<=0 || !stock || stock<=0){
      errEl.textContent = "Fill in an item name, a price above $0, and at least 1 in stock.";
      errEl.style.display = 'block';
      return;
    }

    const brandRequired = isVehicle || isBrandChecked;
    if(brandRequired){
      if(!pendingImageDataUrl){
        errEl.textContent = "Cars, motorcycles, and brand-name or designer items need a photo before they can be listed.";
        errEl.style.display = 'block';
        return;
      }
      if(price <= BRAND_MIN_PRICE){
        errEl.textContent = `Cars, motorcycles, and brand-name or designer items must be priced above $${BRAND_MIN_PRICE}.`;
        errEl.style.display = 'block';
        return;
      }
    }

    let vehicleAdjustNote = "";
    if(isVehicle){
      size = 'Large';
      if(price > VEHICLE_HIGH_VALUE_THRESHOLD){
        const clamped = Math.min(Math.max(stock, VEHICLE_HIGH_VALUE_MIN), VEHICLE_HIGH_VALUE_MAX);
        if(clamped !== stock) vehicleAdjustNote = ` Stock set to ${clamped} — vehicles over $100k are limited to 3–6 in stock.`;
        stock = clamped;
      } else if(stock > SIZE_LIMITS.Large){
        errEl.textContent = `Large items are capped at ${SIZE_LIMITS.Large} in stock.`;
        errEl.style.display = 'block';
        return;
      }
    } else {
      const limit = SIZE_LIMITS[size];
      if(stock > limit){
        errEl.textContent = `${size} items are capped at ${limit} in stock. Lower the quantity or choose a different size.`;
        errEl.style.display = 'block';
        return;
      }
    }

    const newProduct = {
      id: PRODUCTS.length ? Math.max(...PRODUCTS.map(p=>p.id)) + 1 : 1,
      name, maker, price, cat, size, desc, color,
      image: pendingImageDataUrl || null,
      rating: 5.0, reviews: 0, stock, lastStock: stock,
      tags: Array.from(sellerTags),
      isUserListing: true,
      isBrand: brandRequired
    };
    PRODUCTS.push(newProduct);
    userListings.push(newProduct);
    saveState('fieldstone_listings', userListings);
    pendingImageDataUrl = null;
    closeAllModals();
    renderCategories();
    renderGrid();
    showToast(`🎉 ${name} is live on Fieldstone.${vehicleAdjustNote}`);
  }

  function removeListing(id){
    PRODUCTS = PRODUCTS.filter(p=>p.id!==id);
    userListings = userListings.filter(p=>p.id!==id);
    saveState('fieldstone_listings', userListings);
    closeAllModals();
    renderCategories();
    renderGrid();
    showToast("Listing removed");
  }

  document.getElementById('sellBtn').addEventListener('click', openSeller);

  // ---------- mascot ----------
  let mascotTipIndex = 0;
  let mascotTimer = null;
  function showMascotTip(advance){
    const bubble = document.getElementById('mascotBubble');
    if(advance){ mascotTipIndex = (mascotTipIndex + 1) % MASCOT_TIPS.length; }
    bubble.innerHTML = `<button class="mascot-bubble-close" id="mascotBubbleClose" aria-label="Dismiss">×</button>${MASCOT_TIPS[mascotTipIndex]}`;
    bubble.classList.add('show');
    document.getElementById('mascotBubbleClose').addEventListener('click', (e)=>{
      e.stopPropagation();
      bubble.classList.remove('show');
      clearTimeout(mascotTimer);
    });
    clearTimeout(mascotTimer);
    mascotTimer = setTimeout(()=> bubble.classList.remove('show'), 5000);
  }
  document.getElementById('mascotBtn').addEventListener('click', ()=> showMascotTip(true));
  function initMascotGreeting(){
    setTimeout(()=> showMascotTip(false), 900);
  }

  // ---------- onboarding ----------
  function transitionOnboardTo(renderFn){
    const panel = document.getElementById('onboardPanel');
    panel.style.transition = 'transform .28s cubic-bezier(.4,0,.2,1), opacity .28s ease';
    panel.style.transform = 'translateX(-36px)';
    panel.style.opacity = '0';
    setTimeout(()=>{
      renderFn();
      const p = document.getElementById('onboardPanel');
      p.style.transition = 'none';
      p.style.transform = 'translateX(36px)';
      p.style.opacity = '0';
      void p.offsetHeight;
      p.style.transition = 'transform .28s cubic-bezier(.4,0,.2,1), opacity .28s ease';
      p.style.transform = 'translateX(0)';
      p.style.opacity = '1';
    }, 280);
  }

  function renderOnboardGreeting(){
    document.getElementById('onboardPanel').innerHTML = `
      <div class="onboard-emoji">🪨</div>
      <h1>Welcome to Fieldstone</h1>
      <p>A marketplace for independent makers — now with vehicles, watches, and jewelry from verified sellers too.</p>
      <div class="onboard-actions">

        <button class="onboard-btn ghost" id="obSkipBtn">Skip</button>
      </div>
    `;

    document.getElementById('obSkipBtn').addEventListener('click', ()=> transitionOnboardTo(renderOnboardTerms));
  }

  function renderOnboardExplain(){
    document.getElementById('onboardPanel').innerHTML = `
      <h1>How Fieldstone works</h1>
      <div class="onboard-steps">
        <div class="onboard-step" style="animation-delay:.05s;"><span>🔍</span><div><strong>Browse & discover</strong><p>Filter by category, rating, and price — or take the quiz for picks made for you.</p></div></div>
        <div class="onboard-step" style="animation-delay:.15s;"><span>🛍️</span><div><strong>List your goods</strong><p>Connect your Gmail and list anything from handmade crafts to vehicles.</p></div></div>

        <div class="onboard-step" style="animation-delay:.35s;"><span>📦</span><div><strong>Checkout</strong><p>This is a demo store — checkout is simulated and nothing is really charged.</p></div></div>
      </div>
      <div class="onboard-actions">
        <button class="onboard-btn primary" id="obContinueBtn">Continue</button>
      </div>

        <p><strong>4. No warranties.</strong> Fieldstone is provided "as is," without warranties of any kind, express or implied.</p>
        <p><strong>5. Acceptance.</strong> By continuing, you acknowledge you've read and agree to these terms.</p>

      </div>
    `;

    const agreeBtn = document.getElementById('obAgreeBtn');
    checkbox.addEventListener('change', ()=>{ agreeBtn.disabled = !checkbox.checked; });
    agreeBtn.addEventListener('click', ()=>{
      saveState('fieldstone_onboarded', true);
      closeOnboarding();

  function closeOnboarding(){
    const ov = document.getElementById('onboardOverlay');
    ov.style.opacity = '0';
    setTimeout(()=>{
      ov.style.display = 'none';
      document.body.style.overflow = '';
      initMascotGreeting();
    }, 300);
  }

  // ---------- sidebar (mobile slide-in) ----------
  const sidebarEl = document.getElementById('sidebar');
  function openSidebar(){
    sidebarEl.classList.add('open');
    overlay.classList.add('open');
    document.body.style.overflow = 'hidden';
  }
  function closeSidebar(){
    sidebarEl.classList.remove('open');
    if(!drawer.classList.contains('open') && !document.querySelector('.modal.open')){
      overlay.classList.remove('open');
      document.body.style.overflow = '';
    }
  }
  document.getElementById('filterToggle').addEventListener('click', openSidebar);
  document.getElementById('closeSidebar').addEventListener('click', closeSidebar);

  // ---------- modal / overlay plumbing ----------
  function openOverlayFor(modalEl){
    closeSidebar();
    overlay.classList.add('open');
    document.querySelectorAll('.modal').forEach(m=> m!==modalEl && m.classList.remove('open'));
    modalEl.classList.add('open');
    document.body.style.overflow = 'hidden';
  }
  function closeAllModals(){
    document.querySelectorAll('.modal').forEach(m=> m.classList.remove('open'));
    if(!drawer.classList.contains('open') && !sidebarEl.classList.contains('open')){
      overlay.classList.remove('open');
      document.body.style.overflow = '';
    }
    currentModalId = null;
    pendingCartAction = null;
  }

  function showToast(msg){
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(window._toastTimer);
    window._toastTimer = setTimeout(()=> toast.classList.remove('show'), 1800);
  }

  // ---------- drawer ----------
  const overlay = document.getElementById('overlay');
  const drawer = document.getElementById('drawer');
  function openDrawer(){
    closeAllModals();
    closeSidebar();
    overlay.classList.add('open');
    drawer.classList.add('open');
    document.body.style.overflow = 'hidden';
  }
  function closeDrawer(){
    drawer.classList.remove('open');
    if(!sidebarEl.classList.contains('open') && !document.querySelector('.modal.open')){
      overlay.classList.remove('open');
      document.body.style.overflow = '';
    }
  }
  document.getElementById('openCart').addEventListener('click', openDrawer);
  document.getElementById('closeCart').addEventListener('click', closeDrawer);
  overlay.addEventListener('click', ()=>{
    closeDrawer();
    closeAllModals();
    closeSidebar();
    overlay.classList.remove('open');
    document.body.style.overflow = '';
  });
  document.addEventListener('keydown', (e)=>{
    if(e.key === 'Escape'){
      closeDrawer();
      closeAllModals();
      closeSidebar();
      overlay.classList.remove('open');
      document.body.style.overflow = '';
    }
  });

  // ---------- search ----------
  const searchInput = document.getElementById('searchInput');
  const searchClear = document.getElementById('searchClear');
  searchInput.addEventListener('input', (e)=>{
    query = e.target.value;
    searchClear.classList.toggle('show', query.length > 0);
    renderGrid();
  });
  searchClear.addEventListener('click', ()=>{
    query = "";
    searchInput.value = "";
    searchClear.classList.remove('show');
    searchInput.focus();
    renderGrid();
  });

  const priceRange = document.getElementById('priceRange');
  const priceLabel = document.getElementById('priceLabel');
  priceRange.addEventListener('input', (e)=>{

    renderGrid();
  });

  document.getElementById('clearFilters').addEventListener('click', ()=>{

    renderCategories();
    renderRatingFilter();
    updateRatingLabel();
    renderGrid();
    updateBreadcrumb();

  document.getElementById('crumbHome').addEventListener('click', ()=>{
    activeCat = "All"; showFavsOnly = false;
    updateFavUI();
    renderCategories();
    renderGrid();
    updateBreadcrumb();
  });

  document.getElementById('logoBtn').addEventListener('click', ()=>{
    activeCat = "All"; query = ""; showFavsOnly = false;
    searchInput.value = ""; searchClear.classList.remove('show');
    updateFavUI();
    renderCategories();
    renderGrid();
    updateBreadcrumb();
  });

  renderCategories();
  renderRatingFilter();
  updateRatingLabel();
  renderPrefBlock();
  renderSubBlock();
  renderGrid();
  updateCartUI();
  updateFavUI();

  if(!loadState('fieldstone_onboarded', false)){
    document.body.style.overflow = 'hidden';
    document.getElementById('onboardOverlay').style.display = 'flex';
    renderOnboardGreeting();
  } else {
    initMascotGreeting();
  }
</script>
